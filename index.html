<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <meta name="referrer" content="no-referrer" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Pick3" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <title>Pick3</title>
  <style>
    :root {
      --bg: #0f1115; --surface: #181c24; --surface-2: #222733; --border: #2c3342;
      --text: #f3f5f8; --muted: #9aa3b2; --accent: #ff6b35;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg); color: var(--text); min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      padding: 32px 16px 40px; max-width: 520px; margin: 0 auto; line-height: 1.45;
    }
    .brand { font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: 0.08em; }
    h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; margin-top: 6px; }
    .sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 24px; }
    .svc {
      display: flex; flex-direction: column; gap: 6px; min-height: 148px; padding: 18px 16px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
      color: var(--text); text-decoration: none;
    }
    .svc:active { background: var(--surface-2); }
    .svc .icon { font-size: 34px; line-height: 1; }
    .svc .name { font-size: 17px; font-weight: 700; margin-top: 6px; }
    .svc .desc { color: var(--muted); font-size: 13px; }
    .foot { margin-top: 24px; color: var(--muted); font-size: 12px; }
    .foot a { color: var(--muted); }
    @media (max-width: 340px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <p class="brand">PICK 3</p>
  <h1>무엇을 할까요?</h1>
  <p class="sub" id="who">필요한 서비스를 고르세요.</p>

  <nav class="grid" id="grid" aria-label="서비스"></nav>

  <p class="foot" id="foot"></p>

  <script>
    // To add a service: append one entry. `href` is a page next to this one.
    const SERVICES = [
      { icon: "🍽️", name: "맛집 Pick3", desc: "지금 갈 곳 3곳 · 인스타 저장 맛집", href: "pick3.html" },
      { icon: "🧾", name: "의료비 기록", desc: "병원·약국 결제 내역 정리 · 보험 청구용", href: "medical.html" },
    ];

    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    document.getElementById("grid").innerHTML = SERVICES.map((s) => `
      <a class="svc" href="${esc(s.href)}">
        <span class="icon" aria-hidden="true">${s.icon}</span>
        <span class="name">${esc(s.name)}</span>
        <span class="desc">${esc(s.desc)}</span>
      </a>`).join("");

    // Personal token can arrive as #t=... (start link) or ?token=...; keep it on this device only.
    (function captureToken() {
      const params = new URLSearchParams(location.search);
      const t = (new URLSearchParams(location.hash.slice(1)).get("t") || params.get("token") || "").trim();
      if (!t) return;
      try { localStorage.setItem("pick3_token", t); } catch {}
      params.delete("token");
      const qs = params.toString();
      history.replaceState(null, "", location.pathname + (qs ? `?${qs}` : ""));
    })();

    let hasToken = false;
    try { hasToken = Boolean(localStorage.getItem("pick3_token")); } catch {}
    document.getElementById("foot").innerHTML = hasToken
      ? "개인 토큰이 이 기기에 저장되어 있습니다."
      : '개인 토큰이 없습니다. 받은 시작 링크를 먼저 열어 주세요. <a href="start.html">시작 안내</a>';
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f1115" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <title>Pick3 · 10초 맛집 결정기</title>
  <style>
    :root {
      --bg: #0f1115;
      --surface: #181c24;
      --surface-2: #222733;
      --border: #2c3342;
      --text: #f3f5f8;
      --muted: #9aa3b2;
      --accent: #ff6b35;
      --accent-soft: rgba(255, 107, 53, 0.16);
      --naver: #03c75a;
      --kakao: #fee500;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      line-height: 1.45;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
    }
    .app {
      width: 100%;
      max-width: 440px;
      padding: 20px 16px 40px;
    }
    header { margin-bottom: 18px; }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 8px;
    }
    h1 { font-size: 23px; font-weight: 800; letter-spacing: -0.02em; }
    .subtitle { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 14px;
    }
    .label {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 8px;
      display: block;
    }
    .input-row { display: flex; gap: 8px; }
    input[type="text"] {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 12px 12px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    input.area-input { width: 34%; font-size: 14px; flex-shrink: 0; }
    .go-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 0 14px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      flex-shrink: 0;
    }
    .go-btn:active { opacity: 0.85; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .chip {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .chip.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: #ffb195;
    }
    .chip-add {
      border-style: dashed;
      color: var(--muted);
    }
    .chip-del {
      font-size: 12px;
      color: var(--muted);
      padding: 0 2px;
    }
    .situation-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .sit-btn {
      background: var(--surface-2);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      padding: 12px 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }
    .sit-btn .emoji { font-size: 20px; }
    .sit-btn.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      transform: translateY(-1px);
    }
    .provider-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .area-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .area-chip {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .area-chip.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: #ffb195;
    }
    .compare-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 12px 13px;
      margin-bottom: 12px;
    }
    .compare-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .compare-row {
      display: grid;
      grid-template-columns: 42px 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 6px 0;
      border-top: 1px solid rgba(255,255,255,0.05);
      font-size: 12px;
    }
    .compare-row:first-of-type { border-top: none; }
    .compare-rank { font-weight: 800; color: var(--text); }
    .compare-name { font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .compare-meta { color: #ffd166; font-weight: 700; font-size: 11px; white-space: nowrap; }
    .prov-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 10px;
      padding: 8px 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .prov-btn.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--text);
    }
    .meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
      margin: 14px 2px 10px;
    }
    .badge-source {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--border);
    }
    .top-card {
      background: linear-gradient(160deg, #211a18 0%, #181c24 65%);
      border: 1.5px solid var(--accent);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .rank-pill {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 999px;
      margin-bottom: 8px;
    }
    .place-name { font-size: 19px; font-weight: 800; letter-spacing: -0.01em; }
    .place-link { color: inherit; text-decoration: none; border-bottom: 1px dashed rgba(255,255,255,0.28); }
    .place-link:hover { color: var(--accent); }
    .place-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .reason {
      margin-top: 10px;
      font-size: 14px;
      color: #f8fafc;
      background: rgba(255, 255, 255, 0.04);
      padding: 10px 12px;
      border-radius: 10px;
    }
    .price-line { margin-top: 10px; font-size: 13px; font-weight: 700; color: #ffd166; }
    .caution-pill {
      display: inline-block;
      margin-top: 8px;
      font-size: 11px;
      font-weight: 700;
      color: #fbbf24;
      background: rgba(251, 191, 36, 0.12);
      border: 1px solid rgba(251, 191, 36, 0.35);
      padding: 3px 9px;
      border-radius: 999px;
    }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .tag {
      font-size: 11px;
      font-weight: 600;
      color: #cbd5e1;
      background: var(--surface-2);
      padding: 4px 8px;
      border-radius: 8px;
    }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
    .btn-map {
      text-decoration: none;
      text-align: center;
      font-size: 13px;
      font-weight: 800;
      padding: 11px 10px;
      border-radius: 11px;
      display: block;
    }
    .btn-naver { background: var(--naver); color: #081c10; }
    .btn-kakao { background: var(--kakao); color: #191919; }
    .btn-google { background: #3b82f6; color: #fff; }
    .btn-call { background: #2c3342; color: #f3f5f8; border: 1px solid #3f485c; }
    .card-top-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .pass-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      cursor: pointer;
    }
    .pass-btn:hover { color: #fff; border-color: var(--accent); }
    .alt-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 14px;
      margin-bottom: 10px;
    }
    .alt-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .alt-rank { font-size: 11px; font-weight: 800; color: var(--accent); }
    .alt-name { font-size: 16px; font-weight: 800; margin-top: 2px; }
    .share-btn {
      width: 100%;
      margin-top: 6px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 13px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .share-btn:active { opacity: 0.8; }
    .reels-box {
      margin-top: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px;
      display: none;
    }
    .reels-pre {
      white-space: pre-wrap;
      font-family: inherit;
      font-size: 12px;
      line-height: 1.55;
      color: #e2e8f0;
      margin: 8px 0 10px;
    }
    .error-box { color: #ff8a8a; font-size: 13px; margin-top: 8px; display: none; }
    .empty-hint { text-align: center; color: var(--muted); font-size: 13px; padding: 28px 10px; }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <span class="brand">NO-LIST · PICK 3</span>
      <h1>10초 맛집 결정기</h1>
      <p class="subtitle">목록 20개 대신, 지금 상황에 딱 맞는 3곳만 고릅니다.</p>
    </header>

    <section class="card">
      <label class="label" for="menuInput">1. 뭐 드실 건가요?</label>
      <div class="input-row">
        <input id="menuInput" type="text" placeholder="예: 돼지갈비, 소바" value="돼지갈비" />
        <input id="areaInput" class="area-input" type="text" placeholder="동네 (선택)" />
        <button type="button" class="go-btn" id="searchBtn">찾기</button>
      </div>
      <div class="area-chips" id="areaChips">
        <button type="button" class="area-chip" id="gpsBtn">📍 내 위치</button>
        <button type="button" class="area-chip" data-area="강남">강남</button>
        <button type="button" class="area-chip" data-area="성수">성수</button>
        <button type="button" class="area-chip" data-area="홍대">홍대</button>
        <button type="button" class="area-chip" data-area="여의도">여의도</button>
        <button type="button" class="area-chip" data-area="광화문">광화문</button>
      </div>
      <div class="chips" id="menuChips"></div>
      <div id="errorBox" class="error-box"></div>
    </section>

    <section class="card">
      <span class="label">2. 누구랑, 어떻게 드세요? (원탭 즉시 추천)</span>
      <div class="situation-grid">
        <button type="button" class="sit-btn active" data-sit="solo">
          <span class="emoji">🍚</span>
          <span>혼자 / 점심</span>
        </button>
        <button type="button" class="sit-btn" data-sit="date">
          <span class="emoji">💑</span>
          <span>둘이서 / 데이트</span>
        </button>
        <button type="button" class="sit-btn" data-sit="group">
          <span class="emoji">🍻</span>
          <span>여럿이 / 회식</span>
        </button>
      </div>
      <div class="provider-row" id="providerRow">
        <button type="button" class="prov-btn active" data-prov="kakao">카카오</button>
        <button type="button" class="prov-btn" data-prov="google">구글 평점</button>
        <button type="button" class="prov-btn" data-prov="naver">네이버</button>
        <button type="button" class="prov-btn" data-prov="saved">📌 내 저장</button>
        <button type="button" class="prov-btn" data-prov="auto">자동</button>
      </div>
    </section>

    <section id="resultArea">
      <div class="empty-hint">상황 버튼을 누르면 바로 3곳을 골라드립니다.</div>
    </section>
  </main>

      const fromQuery = params.get("api");
      if (fromQuery) {
        const cleaned = fromQuery.replace(/\/+$/, "");
        localStorage.setItem("pick3_api_base", cleaned);
        return cleaned;
      }
      if (location.pathname.startsWith("/pick3") && !location.hostname.endsWith("github.io")) {
        return "/pick3";
      }
      if (DEFAULT_API_BASE) return DEFAULT_API_BASE.replace(/\/+$/, "");
      return localStorage.getItem("pick3_api_base") || "";
    }

    // Per-user token for "내 저장". Given once via ?token=... link or pasted; kept on this device only.
    function captureTokenFromUrl() {
      const params = new URLSearchParams(location.search);
      const t = (params.get("token") || "").trim();
      if (!t) return;
      try { localStorage.setItem("pick3_token", t); } catch {}
      params.delete("token");
      const qs = params.toString();
      history.replaceState(null, "", location.pathname + (qs ? `?${qs}` : "") + location.hash);
    }

    function getToken() {
      try { return localStorage.getItem("pick3_token") || ""; } catch { return ""; }
    }

    function askToken(reason) {
      const typed = prompt(`${reason}

받은 Pick3 토큰을 붙여넣어 주세요:`, "");
      const t = (typed || "").trim();
      if (t) {
        try { localStorage.setItem("pick3_token", t); } catch {}
      }
      return t;
    }

    async function fetchRecommendation() {
      const query = menuInput.value.trim();
      const area = areaInput.value.trim();
      if (!query) {
        showError("메뉴나 음식 이름을 입력해 주세요.");
        return;
      }
      showError("");

      const apiBase = resolveApiBase();
      const isStaticHost = location.hostname.endsWith("github.io") || location.protocol === "file:";
      const shouldCallBackend = Boolean(apiBase) || !isStaticHost;
      if (shouldCallBackend) {
        let token = "";
        if (currentProvider === "saved") {
          token = getToken() || askToken("'내 저장'은 본인 저장 목록만 보여 줍니다.");
          if (!token) {
            showError("'내 저장'을 보려면 Pick3 토큰이 필요합니다.");
            return;
          }
        }
        try {
          const endpoint = currentProvider === "saved" ? "/api/saved/pick3" : "/api/recommend";
          const reqBody =
            currentProvider === "saved"
              ? { area, lat: currentLat, lng: currentLng }
              : {
                  query,
                  area,
                  situation: currentSituation,
                  provider: currentProvider,
                  lat: currentLat,
                  lng: currentLng,
                };
          const res = await fetch(`${apiBase}${endpoint}`, {
            method: "POST",
            headers: token
              ? { "Content-Type": "application/json", "X-Pick3-Token": token }
              : { "Content-Type": "application/json" },
            body: JSON.stringify(reqBody),
          });
          if (res.status === 401 && currentProvider === "saved") {
            try { localStorage.removeItem("pick3_token"); } catch {}
            showError("토큰이 맞지 않습니다. 다시 '찾기'를 누르고 받은 토큰을 붙여넣어 주세요.");
            return;
          }
          if (res.ok) {
            const data = await res.json();
            lastData = data;
            renderResult(data);
            return;
          }
        } catch {
          // Fall back cleanly to client-side dataset if API is unavailable.
        }
      }

      const data = getClientSideFallback(query, area, currentSituation);
      lastData = data;
      renderResult(data);
    }

    function renderTags(tags) {
      return tags.map((t) => `<span class="tag">#${escapeHtml(t)}</span>`).join("");
    }

    function renderMapButtons(item) {
      const buttons = [
        `<a class="btn-map btn-naver" href="${item.naver_map_url}" target="_blank" rel="noopener">네이버 지도</a>`,
        `<a class="btn-map btn-kakao" href="${item.kakao_map_url}" target="_blank" rel="noopener">카카오맵</a>`,
      ];
      if (item.google_maps_url) {
        buttons.push(`<a class="btn-map btn-google" href="${item.google_maps_url}" target="_blank" rel="noopener">구글 지도</a>`);
      }
      if (item.phone) {
        buttons.push(`<a class="btn-map btn-call" href="tel:${escapeHtml(item.phone)}">📞 전화</a>`);
      }
      const cols = buttons.length <= 2 ? "1fr 1fr" : buttons.length === 3 ? "1fr 1fr 1fr" : "1fr 1fr";
      return `<div class="actions" style="grid-template-columns:${cols}">${buttons.join("")}</div>`;
    }

    function passPick(index) {
      if (!lastData) return;
      const list = [lastData.top_pick, ...(lastData.alternatives || [])];
      const reserves = lastData.reserve_picks || [];
      if (reserves.length > 0) {
        list.splice(index, 1);
        list.push(reserves.shift());
        lastData.reserve_picks = reserves;
      } else if (list.length > 1) {
        const [removed] = list.splice(index, 1);
        list.push(removed);
      }
      lastData.top_pick = list[0];
      lastData.alternatives = list.slice(1, 3);
      renderResult(lastData);
    }

    function renderResult(data) {
      const top = data.top_pick;
      const alts = data.alternatives || [];
      const baseSourceText =
        data.data_source === "saved_places"
          ? "📌 내가 저장한 맛집"
          : data.data_source === "google_places_api"
          ? "실시간 구글 평점순"
          : data.data_source === "kakao_local_api"
          ? "실시간 카카오 로컬"
          : data.data_source === "naver_local_api"
          ? "실시간 네이버 로컬"
          : data.data_source === "curated_sample"
          ? "큐레이션 샘플 데이터"
          : "지도 실검색 가이드";
      const sourceText = data.cached ? `${baseSourceText} · ⚡캐시` : baseSourceText;

      const allThree = [top, ...alts];
      const compareRows = allThree
        .map((item, idx) => {
          const badge = idx === 0 ? "🥇1위" : idx === 1 ? "🥈2위" : "🥉3위";
          const shortMeta = item.distance_text
            ? `🚶${item.distance_text}`
            : item.price_note && !item.price_note.includes("확인")
            ? item.price_note
            : item.rating
            ? `⭐${item.rating.toFixed(1)} (${item.review_count || 0})`
            : item.open_status.includes("중")
            ? "🟢영업중"
            : item.open_status.includes("폐업")
            ? "⚠️폐업의심"
            : item.category;
          return `
            <div class="compare-row">
              <span class="compare-rank">${badge}</span>
              <span class="compare-name">${escapeHtml(item.name)}</span>
              <span class="compare-meta">${escapeHtml(shortMeta)}</span>
            </div>
          `;
        })
        .join("");

      const topDist = top.distance_text ? ` · 🚶 ${escapeHtml(top.distance_text)}` : "";

      let html = `
        <div class="meta-bar">
          <span>기준: ${escapeHtml(data.criteria)}</span>
          <span class="badge-source">${sourceText}</span>
        </div>
        <section class="compare-box">
          <div class="compare-title">⚡ 2초 한눈에 비교 (${escapeHtml(data.area)} · ${escapeHtml(data.query)})</div>
          ${compareRows}
        </section>
        <article class="top-card">
          <div class="card-top-row">
            <span class="rank-pill">🥇 지금 바로 1순위</span>
            <button type="button" class="pass-btn" data-pass="0">✕ 패스</button>
          </div>
          <div class="place-name"><a class="place-link" href="${top.kakao_map_url}" target="_blank" rel="noopener">${escapeHtml(top.name)} ↗</a></div>
          <div class="place-sub">${escapeHtml(top.category)} · ${escapeHtml(top.area)} · ${escapeHtml(top.open_status)}${topDist}</div>
          <div class="reason">${escapeHtml(top.reason)}</div>
          <div class="price-line">💰 ${escapeHtml(top.price_note)}</div>
          ${top.caution_note ? `<div class="caution-pill">${escapeHtml(top.caution_note)}</div>` : ""}
          <div class="tags">${renderTags(top.service_tags)}</div>
          ${renderMapButtons(top)}
        </article>
      `;

      alts.forEach((item, idx) => {
        const medal = idx === 0 ? "🥈 대안 1" : "🥉 대안 2";
        const roleLabel = item.role_badge ? `${medal} · ${escapeHtml(item.role_badge)}` : medal;
        const altDist = item.distance_text ? ` · 🚶 ${escapeHtml(item.distance_text)}` : "";
        html += `
          <article class="alt-card">
            <div class="alt-head">
              <span class="alt-rank">${roleLabel}</span>
              <div style="display:flex;align-items:center;gap:8px;">
                <span class="place-sub">${escapeHtml(item.area)}${altDist}</span>
                <button type="button" class="pass-btn" data-pass="${idx + 1}">✕ 패스</button>
              </div>
            </div>
            <div class="alt-name"><a class="place-link" href="${item.kakao_map_url}" target="_blank" rel="noopener">${escapeHtml(item.name)} ↗</a></div>
            <div class="place-sub">${escapeHtml(item.price_note)}</div>
            ${item.caution_note ? `<div class="caution-pill">${escapeHtml(item.caution_note)}</div>` : ""}
            <div class="reason">${escapeHtml(item.reason)}</div>
            <div class="tags">${renderTags(item.service_tags)}</div>
            ${renderMapButtons(item)}
          </article>
        `;
      });

      html += `<button type="button" class="share-btn" id="copyShareBtn">📋 카톡 공유용 3곳 요약 복사</button>`;
      html += `<button type="button" class="share-btn" id="genReelsBtn" style="margin-top:8px;border-color:rgba(255,107,53,0.45);">🎬 인스타 릴스 시리즈 대본 만들기</button>`;
      html += `<section class="reels-box" id="reelsBox"><div class="compare-title">🎬 15초 인스타 릴스 대본</div><pre class="reels-pre" id="reelsPre"></pre><button type="button" class="share-btn" id="copyReelsBtn">📋 릴스 대본 전체 복사</button></section>`;
      resultArea.innerHTML = html;

      document.getElementById("copyShareBtn").addEventListener("click", copySummary);
      document.getElementById("genReelsBtn").addEventListener("click", generateReelsScript);
      document.getElementById("copyReelsBtn").addEventListener("click", copyReelsText);
      document.querySelectorAll(".pass-btn").forEach((btn) => {
        btn.addEventListener("click", () => passPick(Number(btn.dataset.pass)));
      });
    }

    function buildClientReelsText(data) {
      const places = [data.top_pick, ...(data.alternatives || [])].slice(0, 3);
      const area = data.area || "내 주변";
      const query = data.query || "맛집";
      const sitLabel = data.situation_label || "추천";
      const slots = ["2~6초", "6~10초", "10~14초"];
      const lines = [
        `🎬 [${query} 지도 #1] ${area}에서 실패 없는 딱 3곳`,
        "",
        `[0~2초 훅] ${area}에서 ${query} 어디 갈지 10분 넘게 고른다면 저장하세요. (${sitLabel} 기준)`,
        "",
      ];
      places.forEach((p, idx) => {
        const role = p.role_badge || (idx === 0 ? "종합 1위" : `대안 ${idx}`);
        lines.push(`[${slots[idx] || "10~14초"} | ${idx + 1}. ${p.name} (${role})]`);
        lines.push(`  🎙️ ${idx + 1}번째, ${p.name}. ${p.reason || ""}`);
        if (p.price_note) lines.push(`  💰 ${p.price_note}`);
        if (p.caution_note) lines.push(`  ${p.caution_note}`);
      });
      lines.push(
        "",
        `[14~18초 엔딩 CTA] 다음 #2편은 댓글에 가장 많이 나온 동네로 갑니다! 내 동네 놓치지 않으려면 팔로우해 두세요.`,
        "",
        `#${area.replace(/\s+/g, "")}맛집 #${query.replace(/\s+/g, "")} #맛집추천`
      );
      return lines.join("\n");
    }

    async function generateReelsScript() {
      if (!lastData) return;
      const box = document.getElementById("reelsBox");
      const pre = document.getElementById("reelsPre");
      box.style.display = "block";
      pre.textContent = "대본 생성 중...";
      const apiBase = resolveApiBase();
      const isStaticHost = location.hostname.endsWith("github.io") || location.protocol === "file:";
      if (Boolean(apiBase) || !isStaticHost) {
        try {
          const res = await fetch(`${apiBase}/api/reels-script`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              query: lastData.query,
              area: lastData.area === "내 주변" || lastData.area === "내 위치 주변" ? "" : lastData.area,
              situation: currentSituation,
              provider: currentProvider,
              lat: currentLat,
              lng: currentLng,
              episode: 1,
            }),
          });
          if (res.ok) {
            const scriptData = await res.json();
            pre.textContent = scriptData.full_text;
            return;
          }
        } catch {}
      }
      pre.textContent = buildClientReelsText(lastData);
    }

    async function copyReelsText() {
      const pre = document.getElementById("reelsPre");
      const btn = document.getElementById("copyReelsBtn");
      try {
        await navigator.clipboard.writeText(pre.textContent);
        btn.textContent = "✅ 릴스 대본 복사 완료!";
        setTimeout(() => { btn.textContent = "📋 릴스 대본 전체 복사"; }, 2000);
      } catch {
        btn.textContent = "복사 권한이 없어 직접 선택해 주세요";
      }
    }

    async function copySummary() {
      if (!lastData) return;
      const lines = [
        `[${lastData.area} ${lastData.query} · ${lastData.situation_label} 추천]`,
        `1순위: ${lastData.top_pick.name} (${lastData.top_pick.price_note})`,
        `👉 ${lastData.top_pick.reason}`,
        `📍 ${lastData.top_pick.kakao_map_url}`,
      ];
      lastData.alternatives.forEach((a, i) => {
        lines.push(`${i + 2}순위: ${a.name} - ${a.reason}`);
        lines.push(`📍 ${a.kakao_map_url}`);
      });
      const text = lines.join("\n");
      const btn = document.getElementById("copyShareBtn");
      try {
        await navigator.clipboard.writeText(text);
        btn.textContent = "✅ 복사 완료! 카톡에 붙여넣기 하세요";
        setTimeout(() => { btn.textContent = "📋 카톡 공유용 3곳 요약 복사"; }, 2000);
      } catch {
        btn.textContent = "복사 권한이 없어 직접 선택해 주세요";
      }
    }

    function loadCustomMenus() {
      try {
        const raw = localStorage.getItem("pick3_custom_menus");
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed.filter((m) => typeof m === "string" && m.trim()) : [];
      } catch {
        return [];
      }
    }

    function saveCustomMenus(list) {
      localStorage.setItem("pick3_custom_menus", JSON.stringify(list));
    }

    function addCustomMenu(name) {
      const cleaned = name.trim();
      if (!cleaned) return;
      if (!DEFAULT_MENUS.includes(cleaned)) {
        const custom = loadCustomMenus();
        if (!custom.includes(cleaned)) {
          custom.push(cleaned);
          saveCustomMenus(custom);
        }
      }
      menuInput.value = cleaned;
      renderMenuChips();
      fetchRecommendation();
    }

    function removeCustomMenu(name) {
      const custom = loadCustomMenus().filter((m) => m !== name);
      saveCustomMenus(custom);
      if (menuInput.value.trim() === name) {
        menuInput.value = DEFAULT_MENUS[0];
      }
      renderMenuChips();
      fetchRecommendation();
    }

    function renderMenuChips() {
      const activeMenu = menuInput.value.trim();
      const custom = loadCustomMenus();
      const allMenus = [...DEFAULT_MENUS, ...custom.filter((m) => !DEFAULT_MENUS.includes(m))];
      menuChipsContainer.innerHTML = "";

      allMenus.forEach((menu) => {
        const isCustom = !DEFAULT_MENUS.includes(menu);
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `chip${menu === activeMenu ? " active" : ""}`;
        btn.dataset.menu = menu;

        const labelSpan = document.createElement("span");
        labelSpan.textContent = menu;
        btn.appendChild(labelSpan);

        if (isCustom) {
          const del = document.createElement("span");
          del.className = "chip-del";
          del.textContent = "×";
          del.title = "삭제";
          del.addEventListener("click", (e) => {
            e.stopPropagation();
            removeCustomMenu(menu);
          });
          btn.appendChild(del);
        }

        btn.addEventListener("click", () => {
          menuInput.value = menu;
          renderMenuChips();
          fetchRecommendation();
        });
        menuChipsContainer.appendChild(btn);
      });

      const addBtn = document.createElement("button");
      addBtn.type = "button";
      addBtn.className = "chip chip-add";
      addBtn.textContent = "+ 메뉴 추가";
      addBtn.addEventListener("click", () => {
        const typed = prompt("추가할 메뉴 이름을 입력하세요 (예: 초밥, 라멘, 쌀국수):", "");
        if (typed && typed.trim()) {
          addCustomMenu(typed);
        }
      });
      menuChipsContainer.appendChild(addBtn);
    }

    sitButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        sitButtons.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentSituation = btn.dataset.sit;
        savePrefs();
        fetchRecommendation();
      });
    });

    provButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        provButtons.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentProvider = btn.dataset.prov;
        savePrefs();
        fetchRecommendation();
      });
    });

    searchBtn.addEventListener("click", () => {
      savePrefs();
      renderMenuChips();
      fetchRecommendation();
    });
    menuInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        renderMenuChips();
        fetchRecommendation();
      }
    });
    areaInput.addEventListener("input", () => {
      if (areaInput.value.trim()) {
        currentLat = null;
        currentLng = null;
        document.getElementById("gpsBtn").classList.remove("active");
      }
      document.querySelectorAll(".area-chip[data-area]").forEach((c) => {
        c.classList.toggle("active", c.dataset.area === areaInput.value.trim());
      });
    });

    document.querySelectorAll(".area-chip[data-area]").forEach((chip) => {
      chip.addEventListener("click", () => {
        currentLat = null;
        currentLng = null;
        document.getElementById("gpsBtn").classList.remove("active");
        const nextArea = chip.dataset.area;
        areaInput.value = areaInput.value.trim() === nextArea ? "" : nextArea;
        document.querySelectorAll(".area-chip[data-area]").forEach((c) => {
          c.classList.toggle("active", c.dataset.area === areaInput.value.trim());
        });
        fetchRecommendation();
      });
    });

    document.getElementById("gpsBtn").addEventListener("click", () => {
      const gpsBtn = document.getElementById("gpsBtn");
      if (!navigator.geolocation) {
        showError("이 브라우저는 위치 정보를 지원하지 않습니다.");
        return;
      }
      gpsBtn.textContent = "📍 확인 중...";
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          currentLat = pos.coords.latitude;
          currentLng = pos.coords.longitude;
          areaInput.value = "";
          document.querySelectorAll(".area-chip[data-area]").forEach((c) => c.classList.remove("active"));
          gpsBtn.classList.add("active");
          gpsBtn.textContent = "📍 내 위치 적용됨";
          fetchRecommendation();
        },
        () => {
          gpsBtn.textContent = "📍 내 위치";
          showError("위치 권한이 거부되었거나 가져올 수 없습니다. 동네를 직접 입력해 주세요.");
        },
        { enableHighAccuracy: false, timeout: 6000, maximumAge: 60000 }
      );
    });

    areaInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") fetchRecommendation();
    });

    function savePrefs() {
      try {
        localStorage.setItem("pick3_last_area", areaInput.value.trim());
        localStorage.setItem("pick3_last_sit", currentSituation);
        localStorage.setItem("pick3_last_prov", currentProvider);
      } catch {}
    }

    function restorePrefs() {
      try {
        const savedArea = localStorage.getItem("pick3_last_area");
        const savedSit = localStorage.getItem("pick3_last_sit");
        const savedProv = localStorage.getItem("pick3_last_prov");
        if (savedArea) {
          areaInput.value = savedArea;
          document.querySelectorAll(".area-chip[data-area]").forEach((c) => {
            c.classList.toggle("active", c.dataset.area === savedArea);
          });
        }
        if (savedSit && SITUATION_META[savedSit]) {
          currentSituation = savedSit;
          sitButtons.forEach((b) => b.classList.toggle("active", b.dataset.sit === savedSit));
        }
        if (savedProv && ["kakao", "google", "naver", "saved", "auto"].includes(savedProv)) {
          currentProvider = savedProv;
          provButtons.forEach((b) => b.classList.toggle("active", b.dataset.prov === savedProv));
        }
      } catch {}
    }

    captureTokenFromUrl();
    restorePrefs();
    renderMenuChips();
    fetchRecommendation();
  </script>
</body>
</html>

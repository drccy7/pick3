<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <meta name="referrer" content="no-referrer" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Pick3" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <title>Pick3</title>
  <style>
    :root {
      --bg: #0f1115; --surface: #181c24; --surface-2: #222733; --border: #2c3342;
      --text: #f3f5f8; --muted: #9aa3b2; --accent: #ff6b35;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg); color: var(--text); min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      padding: 32px 16px 40px; max-width: 520px; margin: 0 auto; line-height: 1.45;
    }
    .brand { font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: 0.08em; }
    h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; margin-top: 6px; }
    .sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 24px; }
    .svc {
      display: flex; flex-direction: column; gap: 6px; min-height: 148px; padding: 18px 16px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
      color: var(--text); text-decoration: none;
    }
    .svc:active { background: var(--surface-2); }
    .svc .icon { font-size: 34px; line-height: 1; }
    .svc .name { font-size: 17px; font-weight: 700; margin-top: 6px; }
    .svc .desc { color: var(--muted); font-size: 13px; }
    .acct {
      display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 16px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px;
    }
    .acct .k { color: var(--muted); font-size: 12px; }
    .acct .v { font-size: 17px; font-weight: 700; }
    .acct button {
      font: inherit; font-size: 13px; color: var(--text); background: transparent; white-space: nowrap;
      border: 1px solid var(--border); border-radius: 999px; padding: 7px 12px;
    }
    .panel {
      margin-top: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px;
    }
    .panel h2 { font-size: 15px; font-weight: 700; }
    .panel p { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .panel input {
      display: block; width: 100%; margin-top: 10px; padding: 11px 12px; font: inherit; font-size: 16px;
      color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
    }
    .panel .row { display: flex; gap: 8px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
    .btn {
      font: inherit; font-size: 15px; font-weight: 700; color: #fff; background: var(--accent);
      border: 0; border-radius: 10px; padding: 10px 16px;
    }
    .btn:disabled { opacity: 0.6; }
    .link { font: inherit; font-size: 13px; color: var(--muted); background: none; border: 0; text-decoration: underline; padding: 4px; }
    .err { color: #ff8a8a; font-size: 13px; margin-top: 8px; min-height: 1em; }
    .ok { color: #7ee2a8; }
    [hidden] { display: none !important; }
    .jobs { margin-top: 12px; }
    .job {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; margin-top: 8px;
    }
    .job .head { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
    .job .msg { white-space: pre-line; font-size: 14px; margin-top: 6px; }
    .job.running .msg::before {
      content: ""; display: inline-block; width: 12px; height: 12px; margin-right: 8px; vertical-align: -1px;
      border: 2px solid var(--muted); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .job.running .msg::before { animation: none; } }
    .foot { margin-top: 24px; color: var(--muted); font-size: 12px; }
    .foot a { color: var(--muted); }
    @media (max-width: 340px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <p class="brand">PICK 3</p>
  <h1>무엇을 할까요?</h1>
  <p class="sub">필요한 서비스를 고르세요.</p>

  <div class="acct">
    <div><div class="k">이 기기의 계정</div><div class="v" id="acctName">확인 중…</div></div>
    <button type="button" id="switchBtn">계정 바꾸기</button>
  </div>

  <form class="panel" id="loginPanel" hidden autocomplete="on">
    <h2>이름과 PIN으로 들어가기</h2>
    <p>PIN은 개인 링크로 들어간 기기에서 한 번 만들어 두면 됩니다.</p>
    <input id="loginName" name="username" autocomplete="username" placeholder="이름 (예: 홍길동)" required />
    <input id="loginPin" name="password" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6"
           autocomplete="current-password" placeholder="PIN 숫자 6자리" required />
    <div class="row">
      <button class="btn" type="submit" id="loginBtn">들어가기</button>
      <button class="link" type="button" id="tokenBtn">개인 링크·토큰으로</button>
      <button class="link" type="button" id="loginCancel" hidden>닫기</button>
    </div>
    <div class="err" id="loginErr" role="alert"></div>
  </form>

  <form class="panel" id="pinPanel" hidden>
    <h2 id="pinTitle">PIN 만들기</h2>
    <p>다른 브라우저(카톡 안 브라우저, PC 등)에서는 긴 링크 대신 이름과 PIN으로 들어올 수 있습니다.</p>
    <input id="pin1" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="new-password" placeholder="새 PIN 숫자 6자리" />
    <input id="pin2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="new-password" placeholder="한 번 더" />
    <div class="row">
      <button class="btn" type="submit" id="pinBtn">저장</button>
      <button class="link" type="button" id="pinLater">나중에</button>
    </div>
    <div class="err" id="pinErr" role="alert"></div>
  </form>

  <section class="jobs" id="jobs" hidden aria-live="polite"></section>

  <nav class="grid" id="grid" aria-label="서비스"></nav>

  <p class="foot" id="foot"></p>
  <p class="foot" id="usageFoot" style="margin-top:6px"></p>

  <script src="account.js"></script>
  <script>
    // To add a service: append one entry. `href` is a page next to this one.
    const SERVICES = [
      { icon: "🍽️", name: "맛집 Pick3", desc: "지금 갈 곳 3곳 · 인스타 저장 맛집", href: "pick3.html" },
      { icon: "📌", name: "저장한 맛집", desc: "저장한 곳 전체 · 검색·동네별·삭제", href: "saved.html" },
      { icon: "🧾", name: "의료비 기록", desc: "병원·약국 결제 내역 정리 · 보험 청구용", href: "medical.html" },
      { icon: "💊", name: "처방·조제 기록", desc: "처방받은 약·약국 조제 내역 · 처방조제정보 PDF", href: "prescriptions.html" },
      { icon: "📋", name: "보장분석", desc: "보장분석 보고서 → 청구·보완 제안서", href: "coverage.html" },
      { icon: "📱", name: "나의건강기록", desc: "검진·진료·투약 PDF → 기록으로", href: "docs.html?box=mhr" },
      { icon: "🩺", name: "건강검진", desc: "공유한 건강검진 결과 보관", href: "docs.html?box=checkup" },
      { icon: "🔒", name: "암호 문서", desc: "암호 PDF 열기 · 종류 고르기", href: "docs.html?box=locked", id: "lockedCard" },
    ];

    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    document.getElementById("grid").innerHTML = SERVICES.map((s) => `
      <a class="svc" href="${esc(s.href)}"${s.id ? ` id="${s.id}"` : ""}>
        <span class="icon" aria-hidden="true">${s.icon}</span>
        <span class="name">${esc(s.name)}</span>
        <span class="desc">${esc(s.desc)}</span>
      </a>`).join("");

    const $ = (id) => document.getElementById(id);
    const PIN_LATER = "pick3_pin_later";

    function showLogin(open, canCancel) {
      $("loginPanel").hidden = !open;
      $("loginCancel").hidden = !canCancel;
      $("loginErr").textContent = "";
      if (open) { $("pinPanel").hidden = true; }
    }

    async function offerPin() {
      const has = await Pick3Account.hasPin();
      if (has === undefined) return;            // server asleep / migration not run: say nothing
      $("pinTitle").textContent = has ? "PIN 바꾸기" : "PIN 만들기";
      const later = (() => { try { return localStorage.getItem(PIN_LATER); } catch { return ""; } })();
      $("pinPanel").hidden = has || !!later;
      $("foot").innerHTML = '<button class="link" type="button" id="pinOpen">' + (has ? "PIN 바꾸기" : "PIN 만들기") +
        '</button> · <button class="link" type="button" id="logoutBtn">이 기기에서 로그아웃</button>';
      $("pinOpen").onclick = () => { $("pinPanel").hidden = false; $("pin1").focus(); };
      $("logoutBtn").onclick = () => {
        if (!confirm("이 기기에서 로그아웃할까요? (단축어 저장은 그대로 됩니다)")) return;
        Pick3Account.signOut();
        showAccount();
      };
    }

    async function showAccount() {
      const el = $("acctName");
      const foot = $("foot");
      $("pinPanel").hidden = true;
      if (!Pick3Account.getToken()) {
        el.textContent = "없음";
        foot.innerHTML = '처음이면 받은 개인 시작 링크를 여세요. <a href="start.html">시작 안내</a>';
        showLogin(true, false);
        return;
      }
      showLogin(false);
      el.textContent = Pick3Account.cachedName() ? `${Pick3Account.cachedName()} 님` : "확인 중…";
      foot.textContent = "";
      const n = await Pick3Account.name();
      if (n === null) {
        el.textContent = "로그인 필요";
        Pick3Account.signOut();
        showLogin(true, false);
        $("loginErr").textContent = "로그인이 끝났거나 토큰이 맞지 않습니다. 다시 들어가 주세요.";
      } else {
        el.textContent = n ? `${n} 님` : "확인 못 함 (서버 깨우는 중)";
        if (n) { offerPin(); loadJobs(); loadUsage(); loadLocked(); }
      }
    }

    // Encrypted PDFs waiting for their password: show the count on the 🔒 card.
    async function loadLocked() {
      try {
        const res = await fetch(`${Pick3Account.API}/api/coverage?kind=locked`, { headers: { "X-Pick3-Token": Pick3Account.getToken() } });
        if (!res.ok) return;
        const rows = (await res.json()).reports || [];
        const desc = document.querySelector("#lockedCard .desc");
        if (desc && rows.length) desc.innerHTML = `<b style="color:var(--accent, #ff6b35)">열지 않은 문서 ${rows.length}건</b> · 암호 넣고 종류 고르기`;
      } catch {}
    }

    // This month's Gemini usage (estimate from tokens x price table).
    async function loadUsage() {
      try {
        const res = await fetch(`${Pick3Account.API}/api/usage`, { headers: { "X-Pick3-Token": Pick3Account.getToken() } });
        if (!res.ok) return;
        const u = await res.json();
        if (!u.calls) return;
        $("usageFoot").textContent = `이번 달 AI 사용 ${u.calls}회 · 약 ₩${u.krw.toLocaleString("ko-KR")}${u.unpriced_models.length ? "+" : ""} (추정)`;
      } catch {}
    }

    // Shared links are processed in the background (20-40 s): show progress here.
    let jobsTimer = null;
    async function loadJobs() {
      clearTimeout(jobsTimer);
      const token = Pick3Account.getToken();
      if (!token) { $("jobs").hidden = true; return; }
      let jobs = [];
      try {
        const res = await fetch(`${Pick3Account.API}/api/jobs`, { headers: { "X-Pick3-Token": token } });
        if (res.ok) jobs = (await res.json()).jobs || [];
      } catch { /* server asleep: try again later */ }
      const box = $("jobs");
      const ICON = { link: "🔗" };
      box.hidden = !jobs.length;
      box.innerHTML = jobs.length ? '<h2 style="font-size:15px">최근 처리</h2>' + jobs.map((j) => `
        <div class="job ${j.status === "running" ? "running" : ""}">
          <div class="head"><span>${ICON[j.kind] || "🔗"} ${esc(j.site || "링크")}</span><span>${esc(j.started || "")}${j.finished ? " → " + esc(j.finished) : ""}</span></div>
          <div class="msg">${esc(j.message || "")}</div>
        </div>`).join("") : "";
      if (jobs.some((j) => j.status === "running")) jobsTimer = setTimeout(loadJobs, 3000);
    }

    document.addEventListener("visibilitychange", () => { if (!document.hidden) loadJobs(); });

    $("loginPanel").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = $("loginName").value.trim(), pin = $("loginPin").value.trim();
      $("loginBtn").disabled = true;
      $("loginErr").textContent = "확인 중…";
      const err = await Pick3Account.loginWithPin(name, pin);
      $("loginBtn").disabled = false;
      $("loginErr").textContent = err;
      if (!err) { $("loginPin").value = ""; showAccount(); }
    });
    $("tokenBtn").addEventListener("click", async () => {
      const n = await Pick3Account.switchInteractive();
      if (n) showAccount();
    });
    $("loginCancel").addEventListener("click", () => showLogin(false));

    $("pinPanel").addEventListener("submit", async (e) => {
      e.preventDefault();
      const a = $("pin1").value.trim(), b = $("pin2").value.trim();
      if (a !== b) { $("pinErr").textContent = "두 PIN이 다릅니다."; return; }
      $("pinBtn").disabled = true;
      const err = await Pick3Account.setPin(a);
      $("pinBtn").disabled = false;
      if (err) { $("pinErr").textContent = err; return; }
      $("pin1").value = $("pin2").value = "";
      $("pinErr").innerHTML = '<span class="ok">PIN을 저장했습니다. 이름과 이 PIN으로 다른 브라우저에서 들어오세요.</span>';
      setTimeout(() => { $("pinPanel").hidden = true; $("pinErr").textContent = ""; offerPin(); }, 2500);
    });
    $("pinLater").addEventListener("click", () => {
      try { localStorage.setItem(PIN_LATER, "1"); } catch {}
      $("pinPanel").hidden = true;
    });

    $("switchBtn").addEventListener("click", () => {
      const open = $("loginPanel").hidden;
      showLogin(open, true);
      if (open) $("loginName").focus();
    });

    Pick3Account.ready.then(showAccount);
  </script>
</body>
</html>

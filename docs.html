<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <meta name="referrer" content="no-referrer" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <title>문서함</title>
  <style>
    :root {
      --bg: #0f1115; --surface: #181c24; --surface-2: #222733; --border: #2c3342;
      --text: #f3f5f8; --muted: #9aa3b2; --accent: #ff6b35; --danger: #ff8a8a; --ok: #7ee2a8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg); color: var(--text); min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      padding: 20px 16px 48px; max-width: 560px; margin: 0 auto; line-height: 1.45;
    }
    a { color: inherit; }
    .home { color: var(--muted); text-decoration: none; font-size: 14px; }
    h1 { font-size: 22px; font-weight: 800; margin-top: 10px; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .list { margin-top: 14px; display: grid; gap: 10px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 13px 14px; }
    .card .name { font-size: 15.5px; font-weight: 700; word-break: break-all; }
    .card .meta { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
    .card .msg { white-space: pre-line; font-size: 13.5px; margin-top: 8px; }
    .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
    input[type=password] {
      font: inherit; font-size: 16px; color: var(--text); background: var(--surface-2); flex: 1; min-width: 0;
      border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px;
    }
    .btn {
      font: inherit; font-size: 14px; font-weight: 700; color: #fff; background: var(--accent);
      border: 0; border-radius: 10px; padding: 9px 14px;
    }
    .btn:disabled { opacity: .6; }
    .file, .del {
      font: inherit; font-size: 13px; color: var(--text); background: var(--surface-2);
      border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px;
    }
    .del { color: var(--danger); background: transparent; margin-left: auto; }
    .kinds { display: grid; gap: 6px; margin-top: 10px; }
    .kinds label {
      display: flex; gap: 9px; align-items: center; font-size: 14px; padding: 9px 11px;
      background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
    }
    .kinds label:has(input:checked) { border-color: var(--accent); }
    .kinds .g { margin-left: auto; color: var(--ok); font-size: 12px; }
    .hint { color: var(--muted); font-size: 12.5px; margin-top: 8px; }
    .err { color: var(--danger); font-size: 13px; margin-top: 6px; min-height: 1em; white-space: pre-line; }
    .done { background: var(--surface-2); border-radius: 12px; padding: 11px 13px; font-size: 13.5px;
      white-space: pre-line; margin-top: 12px; }
    .empty { color: var(--muted); font-size: 14px; margin-top: 18px; line-height: 1.6; }
  </style>
</head>
<body>
  <a class="home" href="./">← 홈</a>
  <h1 id="title">문서함</h1>
  <p class="sub" id="lead"></p>
  <p class="sub" id="state">불러오는 중…</p>
  <div class="done" id="done" hidden></div>
  <div class="list" id="list"></div>

  <script src="account.js"></script>
  <script>
    // One page for the document boxes: ?box=locked (암호 문서함) | checkup (건강검진).
    const BOXES = {
      locked: { title: "🔒 암호 문서", lead: "암호가 걸린 PDF는 여기에 모입니다. 암호를 넣으면 Pick3가 종류를 추정하니, 확인하고 저장하세요.",
                empty: "열지 않은 암호 문서가 없습니다." },
      mhr: { title: "📱 나의건강기록", lead: "나의건강기록 앱에서 내보낸 PDF 원본입니다. 진료이력은 의료비 기록에, 투약이력은 처방 기록에 넣었습니다.",
             empty: "저장된 나의건강기록이 없습니다.<br>나의건강기록 앱 → PDF 저장 → 공유 → <b>Pick3</b> 를 고르세요." },
      checkup: { title: "🩺 건강검진", lead: "공유한 건강검진 결과입니다. (분석 기능은 준비 중)",
                 empty: "저장된 건강검진 결과가 없습니다.<br>건강검진 PDF → 공유 → <b>Pick3</b> 를 고르세요." },
    };
    const KINDS = [
      ["mhr", "📱 나의건강기록 (검진·진료·투약)", "구간을 나눠 기록에 넣고 원본은 보관"],
      ["coverage", "📋 보장분석 보고서", "보장분석 화면으로 옮김 · 제안서 작성"],
      ["medical", "🧾 의료비·처방·요양급여내역", "기록으로 저장하고 PDF는 지움"],
      ["checkup", "🩺 건강검진 결과", "건강검진 보관함으로 옮김"],
      ["delete", "🗑 필요 없음", "지움"],
    ];
    const box = BOXES[new URLSearchParams(location.search).get("box")] ? new URLSearchParams(location.search).get("box") : "locked";
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const day = (s) => (s || "").slice(0, 10);
    const hdr = (json) => ({ ...(json ? { "Content-Type": "application/json" } : {}), "X-Pick3-Token": Pick3Account.getToken() });
    document.title = BOXES[box].title.replace(/^\S+\s/, "");
    $("title").textContent = BOXES[box].title;
    $("lead").textContent = BOXES[box].lead;

    function card(r) {
      const meta = [`${day(r.created_at)} 저장`, r.size_bytes ? `${(r.size_bytes / 1048576).toFixed(1)}MB` : ""].filter(Boolean).join(" · ");
      const head = `<div class="name">${esc(r.filename || "문서")}</div><div class="meta">${esc(meta)}</div>`;
      const view = `<button class="file view" type="button" data-id="${r.id}" data-name="${esc(r.filename || "문서.pdf")}">📄 PDF 보기</button>`;
      const del = `<button class="del" type="button" data-id="${r.id}">삭제</button>`;
      if (box === "checkup") return `<article class="card">${head}<div class="row">${view}${del}</div></article>`;
      if (box === "mhr") return `<article class="card">${head}${r.message ? `<div class="msg">${esc(r.message)}</div>` : ""}
        <div class="row">${view}<button class="file again" type="button" data-id="${r.id}">다시 읽기</button>${del}</div>
        <div class="err" data-err="${r.id}"></div></article>`;
      if (r.encrypted) {  // not opened yet
        return `<article class="card">${head}
          <form class="row open" data-id="${r.id}">
            <input type="password" inputmode="numeric" autocomplete="off" placeholder="암호 (보통 생년월일 6자리 또는 8자리)" required />
            <button class="btn" type="submit">열기</button>
          </form><div class="err" data-err="${r.id}"></div>
          <div class="row">${del}</div></article>`;
      }
      const guess = r.suggested || "";
      return `<article class="card">${head}
        <p class="hint">${guess ? "Pick3 추정에 ✓ 표시했습니다. 맞는지 확인하고 저장하세요." : "종류를 골라 주세요."}</p>
        <form class="classify" data-id="${r.id}"><div class="kinds">${KINDS.map(([k, label, note]) => `
          <label><input type="radio" name="k${r.id}" value="${k}" ${k === guess ? "checked" : ""} required />
            <span>${label}<br><span class="sub">${note}</span></span>${k === guess ? '<span class="g">추정</span>' : ""}</label>`).join("")}
        </div><div class="row"><button class="btn" type="submit">저장</button>${view}</div></form>
        <div class="err" data-err="${r.id}"></div></article>`;
    }

    async function load() {
      await Pick3Account.ready;
      if (!Pick3Account.getToken()) { $("state").innerHTML = '계정이 없습니다. <a href="./">홈</a>에서 들어가 주세요.'; return; }
      if (document.activeElement && document.activeElement.tagName === "INPUT" && document.activeElement.type === "password") return;
      let data;
      try {
        const res = await fetch(`${Pick3Account.API}/api/coverage?kind=${box}`, { headers: hdr() });
        if (res.status === 401) { $("state").innerHTML = '로그인이 필요합니다. <a href="./">홈</a>에서 다시 들어가 주세요.'; return; }
        data = await res.json();
        if (!res.ok) throw new Error(data.detail || res.status);
      } catch (e) {
        $("state").textContent = "불러오지 못했습니다. " + (e.message && isNaN(e.message) ? e.message : "서버가 깨어나는 중이면 30초 뒤 새로고침해 주세요.");
        return;
      }
      const rows = data.reports || [];
      $("state").textContent = rows.length ? `${rows.length}건` : "";
      $("list").innerHTML = rows.length ? rows.map(card).join("") : `<p class="empty">${BOXES[box].empty}</p>`;
    }

    $("list").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target, id = form.dataset.id, btn = form.querySelector(".btn");
      const err = document.querySelector(`[data-err="${id}"]`);
      err.textContent = ""; btn.disabled = true;
      if (form.classList.contains("open")) {
        const input = form.querySelector("input");
        const res = await fetch(`${Pick3Account.API}/api/docs/${id}/open`, { method: "POST", headers: hdr(true),
          body: JSON.stringify({ password: input.value }) }).catch(() => null);
        const d = res ? await res.json().catch(() => ({})) : {};
        btn.disabled = false;
        if (!d.ok) { err.textContent = d.message || d.detail || "서버에 연결하지 못했습니다."; return; }
        input.blur(); load(); return;
      }
      const kind = (form.querySelector("input:checked") || {}).value;
      if (!kind) { btn.disabled = false; return; }
      if (kind === "delete" && !confirm("이 문서를 지울까요?")) { btn.disabled = false; return; }
      btn.textContent = kind === "medical" ? "읽는 중… (10~30초)" : "저장 중…";
      const res = await fetch(`${Pick3Account.API}/api/docs/${id}/classify`, { method: "POST", headers: hdr(true),
        body: JSON.stringify({ kind }) }).catch(() => null);
      const d = res ? await res.json().catch(() => ({})) : {};
      btn.disabled = false; btn.textContent = "저장";
      if (!d.ok) { err.textContent = d.message || d.detail || "서버에 연결하지 못했습니다."; return; }
      $("done").hidden = false; $("done").textContent = d.message || "저장했습니다.";
      load();
    });

    $("list").addEventListener("click", async (e) => {
      const v = e.target.closest(".view");
      if (v) {
        const win = window.open("", "_blank");  // open now: Safari blocks pop-ups opened after an await
        try {
          const res = await fetch(`${Pick3Account.API}/api/docs/${v.dataset.id}/original`, { headers: hdr() });
          if (!res.ok) throw new Error(res.status);
          const url = URL.createObjectURL(new File([await res.blob()], v.dataset.name, { type: "application/pdf" }));
          if (win) win.location.href = url;
          else { const a = document.createElement("a"); a.href = url; a.download = v.dataset.name; a.click(); }
        } catch {
          if (win) win.close();
          alert("파일을 받지 못했습니다. 잠시 후 다시 해 주세요.");
        }
        return;
      }
      const ag = e.target.closest(".again");
      if (ag) {
        ag.disabled = true; ag.textContent = "읽는 중…";
        const res = await fetch(`${Pick3Account.API}/api/docs/${ag.dataset.id}/process`, { method: "POST", headers: hdr() }).catch(() => null);
        const d = res ? await res.json().catch(() => ({})) : {};
        if (!d.ok) document.querySelector(`[data-err="${ag.dataset.id}"]`).textContent = d.message || d.detail || "서버에 연결하지 못했습니다.";
        load(); return;
      }
      const d = e.target.closest(".del");
      if (!d || !confirm("이 문서를 지울까요?" + (box === "mhr" ? "\n(이미 넣은 진료·투약 기록은 남습니다)" : ""))) return;
      const res = await fetch(`${Pick3Account.API}/api/coverage/${d.dataset.id}`, { method: "DELETE", headers: hdr() }).catch(() => null);
      const body = res ? await res.json().catch(() => ({})) : {};
      if (!res || !res.ok || body.ok === false) { alert(body.message || "지우지 못했습니다."); return; }
      load();
    });

    document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
    load();
  </script>
</body>
</html>

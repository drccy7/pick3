services:
  - type: web
    name: pick3-api
    runtime: python
    plan: starter
    # PLAYWRIGHT_BROWSERS_PATH=0 keeps Chromium inside the venv so it survives from build to runtime
    buildCommand: pip install -r requirements.txt && python -m playwright install chromium-headless-shell
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: PICK3_INGEST_TOKEN
        sync: false
      - key: PICK3_GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: PICK3_RENDER_DOMAINS
        value: myhom.me

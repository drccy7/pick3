<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f1115" />
  <meta name="referrer" content="no-referrer" />
  <title>처방·조제 기록</title>
  <style>
    :root {
      --bg: #0f1115; --surface: #181c24; --surface-2: #222733; --border: #2c3342;
      --text: #f3f5f8; --muted: #9aa3b2; --accent: #ff6b35; --danger: #ff5c5c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg); color: var(--text); min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      padding: 24px 16px 40px; max-width: 900px; margin: 0 auto; line-height: 1.45;
    }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    h1 { font-size: 22px; font-weight: 800; }
    .back { color: var(--muted); font-size: 14px; text-decoration: none; border: 1px solid var(--border);
            border-radius: 999px; padding: 6px 12px; white-space: nowrap; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    select, button, input[type=search] {
      font: inherit; font-size: 14px; color: var(--text); background: var(--surface);
      border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px;
    }
    input[type=search] { flex: 1 1 180px; min-width: 0; font-size: 16px; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
    button.danger { color: var(--danger); }
    .totals { margin-top: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
    .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
    .tile .k { color: var(--muted); font-size: 12px; }
    .tile .v { font-size: 16px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
    .wrap { margin-top: 16px; overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
    td.drug { min-width: 180px; }
    td.ing { color: var(--muted); min-width: 120px; }
    td.nw, th { white-space: nowrap; }
    th { background: var(--surface-2); color: var(--muted); font-weight: 600; font-size: 12px; position: sticky; top: 0; }
    th[data-sort] { cursor: pointer; user-select: none; -webkit-user-select: none; }
    th.on { color: var(--text); }
    th .arrow { margin-left: 4px; font-size: 10px; color: var(--accent); }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    tbody tr { cursor: pointer; }
    tbody tr:active { background: var(--surface-2); }
    tr.newvisit td { border-top: 2px solid var(--border); }
    .pill { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--border); }
    .pill.조제 { color: #7cc4ff; border-color: #2d5576; }
    .pill.처방 { color: #ffb38a; border-color: #6b3d27; }
    .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
    .msg { margin-top: 16px; color: var(--muted); font-size: 14px; }
    .err { color: var(--danger); }
    dialog {
      background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 16px;
      padding: 18px 16px; width: min(92vw, 440px); margin: auto;
    }
    dialog::backdrop { background: rgba(0, 0, 0, 0.6); }
    dialog h2 { font-size: 17px; margin-bottom: 8px; }
    dialog .detail { color: var(--muted); font-size: 13px; }
    dialog label { display: block; color: var(--muted); font-size: 12px; margin-top: 12px; }
    dialog input[type=text] {
      width: 100%; margin-top: 4px; font: inherit; font-size: 16px; color: var(--text);
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
    }
    dialog label.chk { display: flex; gap: 8px; align-items: center; color: var(--text); font-size: 13px; }
    .dlg-actions { display: flex; gap: 8px; margin-top: 18px; }
    .dlg-actions button { flex: 1; }
    .dlg-err { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 1em; }
  </style>
</head>
<body>
  <div class="top">
    <h1>💊 처방·조제 기록</h1>
    <a class="back" href="./">← 홈</a>
  </div>
  <p class="sub" id="who">병·의원 처방과 약국 조제 내역을 고객·환자별로 정리합니다.</p>

  <div class="bar">
    <select id="patientSel" aria-label="고객·환자"><option value="">전체 고객·환자</option></select>
    <select id="yearSel" aria-label="연도"><option value="">전체 연도</option></select>
    <select id="kindSel" aria-label="구분"><option value="">처방+조제</option><option>처방</option><option>조제</option></select>
    <input type="search" id="q" placeholder="약품·성분·기관 검색" autocomplete="off" />
  </div>
  <div class="bar">
    <button class="primary" id="csvBtn" type="button">엑셀(CSV) 받기</button>
    <button class="danger" id="delPatientBtn" type="button" hidden>이 고객·환자 기록 전체 삭제</button>
  </div>

  <div class="totals" id="totals"></div>
  <div class="wrap">
    <table>
      <thead><tr>
        <th data-sort="patient">고객·환자<span class="arrow"></span></th>
        <th data-sort="visit_date">날짜<span class="arrow"></span></th>
        <th data-sort="provider">기관<span class="arrow"></span></th>
        <th data-sort="kind">구분<span class="arrow"></span></th>
        <th data-sort="drug_name">약품명<span class="arrow"></span></th>
        <th data-sort="ingredient">성분<span class="arrow"></span></th>
        <th class="num" title="1회 투약량 × 1일 횟수 × 총 일수">1회×횟수×일수</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <p class="hint">행을 누르면 이름을 바꾸거나 지울 수 있습니다. 같은 날 처방(병원)과 조제(약국)가 함께 나옵니다.</p>
  <p class="msg" id="msg">불러오는 중…</p>

  <dialog id="editDlg">
    <form id="editForm" method="dialog">
      <h2 id="dTitle">기록</h2>
      <p class="detail" id="dDetail"></p>
      <label>고객·환자<input type="text" id="fPatient" list="patientList" autocomplete="off" /></label>
      <datalist id="patientList"></datalist>
      <label class="chk" id="batchWrap"><input type="checkbox" id="fBatch" checked />
        같이 저장된 <b id="batchN"></b>건 모두 이 이름으로 바꾸기</label>
      <p class="dlg-err" id="dlgErr"></p>
      <div class="dlg-actions">
        <button type="button" class="danger" id="delBtn">삭제</button>
        <button type="button" id="cancelBtn">닫기</button>
        <button type="submit" class="primary">저장</button>
      </div>
    </form>
  </dialog>

  <script src="account.js"></script>
  <script>
    const API = Pick3Account.API;
    const token = () => Pick3Account.getToken();
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const $ = (id) => document.getElementById(id);
    let all = [];
    let editing = null;

    // ---- sort ----
    const SORT_DEFAULT_DIR = { visit_date: -1, patient: 1, provider: 1, kind: 1, drug_name: 1, ingredient: 1 };
    let sortKey = "visit_date", sortDir = -1;
    try {
      const s = JSON.parse(localStorage.getItem("pick3_rx_sort") || "null");
      if (s && s.key in SORT_DEFAULT_DIR) { sortKey = s.key; sortDir = s.dir === 1 ? 1 : -1; }
    } catch {}
    const cmp = (a, b) => (String(a[sortKey] || "").localeCompare(String(b[sortKey] || ""), "ko") * sortDir)
      || b.visit_date.localeCompare(a.visit_date) || a.provider.localeCompare(b.provider, "ko") || (a.id - b.id);

    function filtered() {
      const p = patientSel.value, y = yearSel.value, k = kindSel.value, q = $("q").value.trim().toLowerCase();
      return all.filter((r) => (!p || r.patient === p) && (!y || r.visit_date.startsWith(y)) && (!k || r.kind === k)
        && (!q || `${r.drug_name} ${r.ingredient} ${r.provider}`.toLowerCase().includes(q))).sort(cmp);
    }

    function fillSelect(sel, values, label) {
      const cur = sel.value;
      sel.innerHTML = `<option value="">${label}</option>` + values.map((v) => `<option>${esc(v)}</option>`).join("");
      if (values.includes(cur)) sel.value = cur;
    }

    function refreshFilters() {
      const names = [...new Set(all.map((r) => r.patient).filter(Boolean))].sort();
      fillSelect(patientSel, names, "전체 고객·환자");
      fillSelect(yearSel, [...new Set(all.map((r) => r.visit_date.slice(0, 4)))].sort().reverse(), "전체 연도");
      $("patientList").innerHTML = names.map((p) => `<option value="${esc(p)}">`).join("");
      $("delPatientBtn").hidden = !patientSel.value;
    }

    function render() {
      const rows = filtered();
      for (const th of document.querySelectorAll("th[data-sort]")) {
        const on = th.dataset.sort === sortKey;
        th.classList.toggle("on", on);
        th.querySelector(".arrow").textContent = on ? (sortDir === 1 ? "▲" : "▼") : "";
      }
      let prev = "";
      $("rows").innerHTML = rows.map((r) => {
        const visit = `${r.patient}|${r.visit_date}`;
        const cls = sortKey === "visit_date" && prev && visit !== prev ? "newvisit" : "";
        prev = visit;
        return `<tr data-id="${r.id}" class="${cls}"><td class="nw">${esc(r.patient || "-")}</td><td class="nw">${esc(r.visit_date)}</td>
          <td class="nw">${esc(r.provider)}</td><td class="nw"><span class="pill ${esc(r.kind)}">${esc(r.kind)}</span></td>
          <td class="drug">${esc(r.drug_name)}</td><td class="ing">${esc(r.ingredient)}</td>
          <td class="num nw">${esc(r.dose || "-")}×${esc(r.times_per_day || "-")}×${esc(r.days || "-")}</td></tr>`;
      }).join("");
      const dates = rows.map((r) => r.visit_date).sort();
      const tiles = [
        ["기록", `${rows.length}건`],
        ["처방 / 조제", `${rows.filter((r) => r.kind === "처방").length} / ${rows.filter((r) => r.kind === "조제").length}`],
        ["기관", `${new Set(rows.map((r) => r.provider)).size}곳`],
        ["기간", dates.length ? `${dates[0].slice(0, 7)} ~ ${dates[dates.length - 1].slice(0, 7)}` : "-"],
      ];
      $("totals").innerHTML = tiles.map(([k, v]) => `<div class="tile"><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`).join("");
      $("msg").textContent = rows.length ? "" : (all.length ? "조건에 맞는 기록이 없습니다."
        : "기록이 없습니다. 처방조제정보 PDF를 공유 → '의료비 저장'으로 보내 보세요.");
    }

    async function load() {
      await Pick3Account.ready;
      const t = token();
      if (!t) { $("msg").innerHTML = '<span class="err">이 기기에 계정이 없습니다. 홈에서 [계정 바꾸기]를 눌러 주세요.</span>'; return; }
      try {
        const res = await fetch(`${API}/api/prescriptions`, { headers: { "X-Pick3-Token": t } });
        if (res.status === 401) { $("msg").innerHTML = '<span class="err">토큰이 맞지 않습니다. 홈에서 [계정 바꾸기]를 눌러 주세요.</span>'; return; }
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        all = data.items;
        $("who").textContent = `${data.user} 님 · ${data.count}건`;
        refreshFilters();
        render();
      } catch (e) {
        $("msg").innerHTML = `<span class="err">불러오지 못했습니다 (${esc(e.message)}). 서버가 깨어나는 중이면 30초 뒤 새로고침하세요.</span>`;
      }
    }

    async function api(method, path, body) {
      const res = await fetch(`${API}${path}`, {
        method, headers: { "X-Pick3-Token": token(), ...(body ? { "Content-Type": "application/json" } : {}) },
        body: body ? JSON.stringify(body) : undefined,
      });
      if (!res.ok) {
        let detail = `HTTP ${res.status}`;
        try { const j = await res.json(); if (typeof j.detail === "string") detail = j.detail; } catch {}
        throw new Error(detail);
      }
      return res.json();
    }

    // ---- events ----
    document.querySelector("thead").addEventListener("click", (e) => {
      const th = e.target.closest("th[data-sort]");
      if (!th) return;
      if (th.dataset.sort === sortKey) sortDir = -sortDir;
      else { sortKey = th.dataset.sort; sortDir = SORT_DEFAULT_DIR[sortKey]; }
      try { localStorage.setItem("pick3_rx_sort", JSON.stringify({ key: sortKey, dir: sortDir })); } catch {}
      render();
    });
    for (const el of [patientSel, yearSel, kindSel]) el.addEventListener("change", () => { refreshFilters(); render(); });
    $("q").addEventListener("input", render);

    $("rows").addEventListener("click", (e) => {
      const tr = e.target.closest("tr[data-id]");
      if (!tr) return;
      editing = all.find((r) => String(r.id) === tr.dataset.id);
      if (!editing) return;
      $("dTitle").textContent = editing.drug_name;
      $("dDetail").textContent = `${editing.visit_date} · ${editing.provider} · ${editing.kind} · ${editing.ingredient || ""} · `
        + `1회 ${editing.dose || "-"}, 1일 ${editing.times_per_day || "-"}회, ${editing.days || "-"}일`;
      fPatient.value = editing.patient || "";
      const batch = all.filter((r) => r.created_at === editing.created_at);
      $("batchN").textContent = batch.length;
      $("batchWrap").style.display = batch.length > 1 ? "flex" : "none";
      fBatch.checked = true;
      $("dlgErr").textContent = "";
      editDlg.showModal();
    });

    $("editForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = fPatient.value.trim();
      if (name === (editing.patient || "")) { editDlg.close(); return; }
      const ids = fBatch.checked ? all.filter((r) => r.created_at === editing.created_at).map((r) => r.id) : [editing.id];
      try {
        const out = await api("POST", "/api/prescriptions/patient", { ids, patient: name });
        const byId = new Map(out.items.map((r) => [r.id, r]));
        all = all.map((r) => (byId.has(r.id) ? { ...r, ...byId.get(r.id) } : r));
        refreshFilters(); render(); editDlg.close();
      } catch (err) { $("dlgErr").textContent = `저장하지 못했습니다: ${err.message}`; }
    });

    $("delBtn").addEventListener("click", async () => {
      if (!confirm("이 한 줄을 삭제할까요?")) return;
      try {
        await api("DELETE", `/api/prescriptions/${editing.id}`);
        all = all.filter((r) => r !== editing);
        refreshFilters(); render(); editDlg.close();
      } catch (err) { $("dlgErr").textContent = `삭제하지 못했습니다: ${err.message}`; }
    });
    $("cancelBtn").addEventListener("click", () => editDlg.close());

    $("delPatientBtn").addEventListener("click", async () => {
      const name = patientSel.value;
      if (!name) return;
      const n = all.filter((r) => r.patient === name).length;
      const typed = prompt(`'${name}'의 처방·조제 기록 ${n}건을 모두 삭제합니다. 되돌릴 수 없습니다.\n확인하려면 이름을 그대로 입력하세요:`, "");
      if ((typed || "").trim() !== name) { if (typed !== null) alert("이름이 달라 삭제하지 않았습니다."); return; }
      try {
        const out = await api("DELETE", `/api/prescriptions?patient=${encodeURIComponent(name)}`);
        all = all.filter((r) => r.patient !== name);
        patientSel.value = "";
        refreshFilters(); render();
        alert(`'${name}' 기록 ${out.deleted}건을 삭제했습니다.`);
      } catch (err) { alert(`삭제하지 못했습니다: ${err.message}`); }
    });

    $("csvBtn").addEventListener("click", () => {
      const rows = filtered();
      const head = ["고객·환자", "날짜", "기관", "구분", "약품명", "성분명", "1회투약량", "1일투여횟수", "총투약일수"];
      const q = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
      const lines = [head.map(q).join(",")].concat(rows.map((r) =>
        [r.patient, r.visit_date, r.provider, r.kind, r.drug_name, r.ingredient, r.dose, r.times_per_day, r.days].map(q).join(",")));
      const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `처방조제_${patientSel.value || "전체"}_${yearSel.value || "전체"}.csv`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    });

    load();
  </script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f1115" />
  <meta name="referrer" content="no-referrer" />
  <title>의료비 기록</title>
  <style>
    :root {
      --bg: #0f1115; --surface: #181c24; --surface-2: #222733; --border: #2c3342;
      --text: #f3f5f8; --muted: #9aa3b2; --accent: #ff6b35; --danger: #ff5c5c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg); color: var(--text); min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      padding: 24px 16px 40px; max-width: 760px; margin: 0 auto; line-height: 1.45;
    }
    h1 { font-size: 22px; font-weight: 800; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    select, button {
      font: inherit; font-size: 14px; color: var(--text); background: var(--surface);
      border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
    .totals { margin-top: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
    .tile .k { color: var(--muted); font-size: 12px; }
    .tile .v { font-size: 17px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
    .wrap { margin-top: 16px; overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { background: var(--surface-2); color: var(--muted); font-weight: 600; font-size: 12px; position: sticky; top: 0; }
    th[data-sort] { cursor: pointer; user-select: none; -webkit-user-select: none; }
    th.on { color: var(--text); }
    th .arrow { margin-left: 4px; font-size: 10px; color: var(--accent); }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    tr:last-child td { border-bottom: 0; }
    tbody tr { cursor: pointer; }
    tbody tr:active { background: var(--surface-2); }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .back { color: var(--muted); font-size: 14px; text-decoration: none; border: 1px solid var(--border);
            border-radius: 999px; padding: 6px 12px; white-space: nowrap; }
    .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
    dialog {
      background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 16px;
      padding: 18px 16px; width: min(92vw, 420px); margin: auto;
    }
    dialog::backdrop { background: rgba(0, 0, 0, 0.6); }
    dialog h2 { font-size: 17px; margin-bottom: 12px; }
    dialog label { display: block; color: var(--muted); font-size: 12px; margin-top: 10px; }
    dialog input, dialog select {
      width: 100%; margin-top: 4px; font: inherit; font-size: 16px; color: var(--text);
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
    }
    dialog label.chk { display: flex; gap: 8px; align-items: center; color: var(--text); font-size: 13px; }
    dialog label.chk input { width: auto; margin: 0; }
    .dlg-actions { display: flex; gap: 8px; margin-top: 18px; }
    .dlg-actions button { flex: 1; }
    button.danger { color: var(--danger); }
    .dlg-err { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 1em; }
    .msg { margin-top: 16px; color: var(--muted); font-size: 14px; }
    .err { color: var(--danger); }
  </style>
</head>
<body>
  <div class="top">
    <h1>🧾 의료비 기록</h1>
    <a class="back" href="./">← 홈</a>
  </div>
  <p class="sub" id="who">병원·약국 결제 내역을 환자·연도별로 정리합니다.</p>

  <div class="bar">
    <select id="patientSel" aria-label="환자"><option value="">전체 환자</option></select>
    <select id="yearSel" aria-label="연도"><option value="">전체 연도</option></select>
    <select id="kindSel" aria-label="구분">
      <option value="">전체 구분</option><option>병원</option><option>약국</option><option>안경</option><option>기타</option>
    </select>
    <button class="primary" id="csvBtn" type="button">엑셀(CSV) 받기</button>
  </div>

  <div class="totals" id="totals"></div>
  <div class="wrap">
    <table>
      <thead><tr>
        <th data-sort="patient">환자<span class="arrow"></span></th>
        <th data-sort="visit_date">날짜<span class="arrow"></span></th>
        <th data-sort="provider">기관<span class="arrow"></span></th>
        <th data-sort="kind">구분<span class="arrow"></span></th>
        <th data-sort="amount" class="num">금액<span class="arrow"></span></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <p class="hint">행을 누르면 고치거나 지울 수 있습니다.</p>
  <p class="msg" id="msg">불러오는 중…</p>

  <dialog id="editDlg">
    <form id="editForm" method="dialog">
      <h2>기록 수정</h2>
      <label>환자<input id="fPatient" list="patientList" autocomplete="off" /></label>
      <datalist id="patientList"></datalist>
      <label class="chk" id="batchWrap"><input type="checkbox" id="fBatch" checked />
        같이 저장된 <b id="batchN"></b>건 모두 이 환자로 바꾸기</label>
      <label>날짜<input id="fDate" type="date" required /></label>
      <label>기관<input id="fProvider" required autocomplete="off" /></label>
      <label>구분
        <select id="fKind"><option>병원</option><option>약국</option><option>안경</option><option>기타</option></select>
      </label>
      <label>금액(원)<input id="fAmount" type="number" inputmode="numeric" min="1" step="1" required /></label>
      <p class="dlg-err" id="dlgErr"></p>
      <div class="dlg-actions">
        <button type="button" class="danger" id="delBtn">삭제</button>
        <button type="button" id="cancelBtn">취소</button>
        <button type="submit" class="primary" id="saveBtn">저장</button>
      </div>
    </form>
  </dialog>

  <script src="account.js"></script>
  <script>
    const API = Pick3Account.API;
    let all = [];

    const token = () => Pick3Account.getToken();

    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const won = (n) => `${Number(n).toLocaleString("ko-KR")}원`;

    // Sort state: column key + direction. Ties fall back to newest date first.
    const SORT_DEFAULT_DIR = { visit_date: -1, amount: -1, patient: 1, provider: 1, kind: 1 };
    let sortKey = "visit_date", sortDir = -1;
    try {
      const saved = JSON.parse(localStorage.getItem("pick3_medical_sort") || "null");
      if (saved && saved.key in SORT_DEFAULT_DIR) { sortKey = saved.key; sortDir = saved.dir === 1 ? 1 : -1; }
    } catch {}

    function compareRows(a, b) {
      const va = a[sortKey], vb = b[sortKey];
      const primary = sortKey === "amount"
        ? (Number(va) - Number(vb))
        : String(va || "").localeCompare(String(vb || ""), "ko");
      return primary * sortDir || b.visit_date.localeCompare(a.visit_date) || (b.id - a.id);
    }

    function filtered() {
      const p = patientSel.value, y = yearSel.value, k = kindSel.value;
      return all
        .filter((r) => (!p || r.patient === p) && (!y || r.visit_date.startsWith(y)) && (!k || r.kind === k))
        .sort(compareRows);
    }

    function renderSortHeads() {
      for (const th of document.querySelectorAll("th[data-sort]")) {
        const on = th.dataset.sort === sortKey;
        th.classList.toggle("on", on);
        th.querySelector(".arrow").textContent = on ? (sortDir === 1 ? "▲" : "▼") : "";
        th.setAttribute("aria-sort", on ? (sortDir === 1 ? "ascending" : "descending") : "none");
      }
    }

    document.querySelector("thead").addEventListener("click", (e) => {
      const th = e.target.closest("th[data-sort]");
      if (!th) return;
      const key = th.dataset.sort;
      if (key === sortKey) sortDir = -sortDir;
      else { sortKey = key; sortDir = SORT_DEFAULT_DIR[key]; }
      try { localStorage.setItem("pick3_medical_sort", JSON.stringify({ key: sortKey, dir: sortDir })); } catch {}
      render();
    });

    function fillSelect(sel, values, label) {
      const cur = sel.value;
      sel.innerHTML = `<option value="">${label}</option>` + values.map((v) => `<option>${esc(v)}</option>`).join("");
      if (values.includes(cur)) sel.value = cur;
    }

    function render() {
      const rows = filtered();
      renderSortHeads();
      document.getElementById("rows").innerHTML = rows.map((r) => `
        <tr data-id="${r.id}"><td>${esc(r.patient || "-")}</td><td>${esc(r.visit_date)}</td><td>${esc(r.provider)}</td>
        <td>${esc(r.kind)}</td><td class="num">${won(r.amount)}</td></tr>`).join("");
      const sum = (f) => rows.filter(f).reduce((a, r) => a + r.amount, 0);
      const tiles = [["합계", sum(() => true), rows.length]]
        .concat(["병원", "약국", "안경", "기타"].map((k) => [k, sum((r) => r.kind === k), rows.filter((r) => r.kind === k).length]))
        .filter(([, , n], i) => i === 0 || n > 0);
      document.getElementById("totals").innerHTML = tiles.map(([k, v, n]) =>
        `<div class="tile"><div class="k">${k} · ${n}건</div><div class="v">${won(v)}</div></div>`).join("");
      document.getElementById("msg").textContent = rows.length ? "" : "기록이 없습니다. 단축어 '의료비 저장'으로 결제 내역 화면을 공유해 보세요.";
    }

    async function load() {
      await Pick3Account.ready;
      const t = token();
      const msg = document.getElementById("msg");
      if (!t) { msg.innerHTML = '<span class="err">이 기기에 계정이 없습니다. 개인 시작 링크를 열거나 홈에서 [계정 바꾸기]를 눌러 주세요.</span>'; return; }
      try {
        const res = await fetch(`${API}/api/medical`, { headers: { "X-Pick3-Token": t } });
        if (res.status === 401) { msg.innerHTML = '<span class="err">토큰이 맞지 않습니다. 홈에서 [계정 바꾸기]를 눌러 주세요.</span>'; return; }
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        all = data.items;
        document.getElementById("who").textContent = `${data.user} 님 · ${data.count}건`;
        refreshFilters();
        render();
      } catch (e) {
        msg.innerHTML = `<span class="err">불러오지 못했습니다 (${esc(e.message)}). 서버가 깨어나는 중이면 30초 뒤 새로고침하세요.</span>`;
      }
    }

    function downloadCsv() {
      const rows = filtered();
      const head = ["환자", "연도", "날짜", "기관", "구분", "금액"];
      const q = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
      const lines = [head.map(q).join(",")].concat(rows.map((r) =>
        [r.patient, r.visit_date.slice(0, 4), r.visit_date, r.provider, r.kind, r.amount].map(q).join(",")));
      const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `의료비_${patientSel.value || "전체"}_${yearSel.value || "전체"}.csv`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }

    const dlg = document.getElementById("editDlg");
    const dlgErr = document.getElementById("dlgErr");
    let editing = null;

    function refreshFilters() {
      fillSelect(patientSel, [...new Set(all.map((r) => r.patient || ""))].filter(Boolean).sort(), "전체 환자");
      fillSelect(yearSel, [...new Set(all.map((r) => r.visit_date.slice(0, 4)))].sort().reverse(), "전체 연도");
      document.getElementById("patientList").innerHTML =
        [...new Set(all.map((r) => r.patient).filter(Boolean))].map((p) => `<option value="${esc(p)}">`).join("");
    }

    document.getElementById("rows").addEventListener("click", (e) => {
      const tr = e.target.closest("tr[data-id]");
      if (!tr) return;
      editing = all.find((r) => String(r.id) === tr.dataset.id);
      if (!editing) return;
      fPatient.value = editing.patient || "";
      fDate.value = editing.visit_date;
      fProvider.value = editing.provider;
      fKind.value = editing.kind;
      fAmount.value = editing.amount;
      // Rows saved by one capture share created_at (one INSERT) - offer to rename them together.
      const batch = all.filter((r) => r.created_at === editing.created_at);
      document.getElementById("batchN").textContent = batch.length;
      document.getElementById("batchWrap").style.display = batch.length > 1 ? "flex" : "none";
      fBatch.checked = true;
      dlgErr.textContent = "";
      dlg.showModal();
    });

    async function renamePatient(ids, patient) {
      const res = await fetch(`${API}/api/medical/patient`, {
        method: "POST",
        headers: { "X-Pick3-Token": token(), "Content-Type": "application/json" },
        body: JSON.stringify({ ids, patient }),
      });
      if (!res.ok) {
        let detail = `HTTP ${res.status}`;
        try { const j = await res.json(); if (typeof j.detail === "string") detail = j.detail; } catch {}
        throw new Error(detail);
      }
      const byId = new Map((await res.json()).items.map((r) => [r.id, r]));
      all = all.map((r) => (byId.has(r.id) ? { ...r, ...byId.get(r.id) } : r));
      editing = all.find((r) => r.id === editing.id);
    }

    async function callApi(method, body) {
      const res = await fetch(`${API}/api/medical/${editing.id}`, {
        method,
        headers: { "X-Pick3-Token": token(), ...(body ? { "Content-Type": "application/json" } : {}) },
        body: body ? JSON.stringify(body) : undefined,
      });
      if (!res.ok) {
        let detail = `HTTP ${res.status}`;
        try { const j = await res.json(); if (typeof j.detail === "string") detail = j.detail; } catch {}
        throw new Error(detail);
      }
      return res.json();
    }

    document.getElementById("editForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const changes = {};
      const next = { patient: fPatient.value.trim(), visit_date: fDate.value, provider: fProvider.value.trim(),
                     kind: fKind.value, amount: Number(fAmount.value) };
      for (const [k, v] of Object.entries(next)) if (v !== editing[k]) changes[k] = v;
      if (!Object.keys(changes).length) { dlg.close(); return; }
      try {
        const batch = all.filter((r) => r.created_at === editing.created_at);
        if ("patient" in changes && batch.length > 1 && fBatch.checked) {
          await renamePatient(batch.map((r) => r.id), changes.patient);
          delete changes.patient;
        }
        if (Object.keys(changes).length) {
          const row = await callApi("PATCH", changes);
          Object.assign(editing, row);
        }
        refreshFilters();
        render();
        dlg.close();
      } catch (err) { dlgErr.textContent = `저장하지 못했습니다: ${err.message}`; }
    });

    document.getElementById("delBtn").addEventListener("click", async () => {
      if (!confirm("이 기록을 삭제할까요?")) return;
      try {
        await callApi("DELETE");
        all = all.filter((r) => r !== editing);
        refreshFilters();
        render();
        dlg.close();
      } catch (err) { dlgErr.textContent = `삭제하지 못했습니다: ${err.message}`; }
    });
    document.getElementById("cancelBtn").addEventListener("click", () => dlg.close());
    for (const sel of [patientSel, yearSel, kindSel]) sel.addEventListener("change", render);
    document.getElementById("csvBtn").addEventListener("click", downloadCsv);
    load();
  </script>
</body>
</html>

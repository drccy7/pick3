<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <meta name="referrer" content="no-referrer" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <title>보장분석</title>
  <style>
    :root {
      --bg: #0f1115; --surface: #181c24; --surface-2: #222733; --border: #2c3342;
      --text: #f3f5f8; --muted: #9aa3b2; --accent: #ff6b35; --danger: #ff8a8a; --ok: #7ee2a8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg); color: var(--text); min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      padding: 20px 16px 48px; max-width: 560px; margin: 0 auto; line-height: 1.45;
    }
    a { color: inherit; }
    .home { color: var(--muted); text-decoration: none; font-size: 14px; }
    h1 { font-size: 22px; font-weight: 800; margin-top: 10px; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .list { margin-top: 14px; display: grid; gap: 10px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 13px 14px; }
    .card .name { font-size: 16px; font-weight: 700; }
    .card .meta { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
    .card .msg { white-space: pre-line; font-size: 13.5px; margin-top: 8px; }
    .card.running .msg::before, .card.running .pinfo span:first-child::before {
      content: ""; display: inline-block; width: 12px; height: 12px; margin-right: 8px; vertical-align: -1px;
      border: 2px solid var(--muted); border-top-color: var(--accent); border-radius: 50%; animation: spin .9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .card.running .msg::before { animation: none; } }
    .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
    input[type=password] {
      font: inherit; font-size: 16px; color: var(--text); background: var(--surface-2); flex: 1; min-width: 0;
      border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px;
    }
    .btn {
      font: inherit; font-size: 14px; font-weight: 700; color: #fff; background: var(--accent);
      border: 0; border-radius: 10px; padding: 9px 14px;
    }
    .btn:disabled { opacity: .6; }
    .file, .del {
      font: inherit; font-size: 13px; color: var(--text); background: var(--surface-2);
      border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px;
    }
    .del { color: var(--danger); background: transparent; margin-left: auto; }
    .prog { margin-top: 10px; }
    .steps { display: flex; gap: 4px; font-size: 11.5px; color: var(--muted); }
    .steps span { flex: 1; text-align: center; padding: 3px 0; border-radius: 6px; background: var(--surface-2); }
    .steps span.now { color: #fff; background: var(--accent); font-weight: 700; }
    .steps span.past { color: var(--ok); }
    .bar { height: 8px; border-radius: 99px; background: var(--surface-2); margin-top: 8px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .8s ease; }
    .pinfo { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); margin-top: 6px; }
    .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .stpanel { margin-top: 8px; border-top: 1px solid var(--border); padding-top: 8px; }
    .stpanel .c { padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .stpanel .c .n { font-weight: 700; }
    .stpanel .c .k { color: var(--muted); font-size: 12px; margin: 2px 0 5px; }
    .stpanel select { font: inherit; font-size: 14px; color: var(--text); background: var(--surface-2);
      border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; width: 100%; }
    .stpanel select.set { border-color: var(--accent); }
    .stpanel .hint { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
    .pdfrow { margin-top: 8px; }
    .pdfrow .pdflabel { width: 100%; color: var(--muted); font-size: 12px; }
    .pdfrow .file { font-size: 12.5px; padding: 5px 11px; background: transparent; }
    .err { color: var(--danger); font-size: 13px; margin-top: 6px; min-height: 1em; }
    .empty { color: var(--muted); font-size: 14px; margin-top: 18px; line-height: 1.6; }
  </style>
</head>
<body>
  <a class="home" href="./">← 홈</a>
  <h1>📋 보장분석</h1>
  <p class="sub">보장분석 보고서 PDF를 단축어로 공유하면 여기에 저장됩니다. 고객의 병의원 기록(같은 이름)과 대조해
    청구할 만한 내용과 보완 제안서를 만듭니다.</p>
  <p class="sub" id="state">불러오는 중…</p>
  <p class="sub" id="usage"></p>
  <div class="list" id="list"></div>

  <script src="account.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const day = (s) => (s || "").slice(0, 10);
    let timer = null;
    const STEPS = ["읽기", "대조", "분석", "문서"];
    const mmss = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;

    // Overall % from the server's stage + real counts (stage 1) or typical durations (stage 3).
    function percent(p) {
      if (p.stage === 1) {  // ~8 s until the contract count, then contracts complete in parallel (~30 s)
        if (!p.total || !p.done) return 3 + 12 * Math.min(1, p.stage_elapsed / 10);
        return 15 + 45 * Math.min(p.done, p.total) / p.total;
      }
      if (p.stage === 2) return 62;
      if (p.stage === 3) return 64 + 28 * Math.min(1, p.stage_elapsed / 20);
      return 95;
    }

    function progressHtml(r) {
      const p = r.progress;
      if (!p) return `<div class="msg">${esc(r.message || "작성 중…")}</div>`;
      const detail = p.stage !== 1 ? esc(r.message || "")
        : p.done > 0 ? (p.total && p.done >= p.total ? `계약 ${p.total}건 다 읽음 · 요약표 정리 중` : `계약 ${p.done}${p.total ? "/" + p.total : ""}건 읽음`)
        : r.message === "보고서 올리는 중" ? "보고서 올리는 중" : "보고서 전체를 살펴보는 중";
      return `<div class="prog">
        <div class="steps">${STEPS.map((n, i) => `<span class="${i + 1 === p.stage ? "now" : i + 1 < p.stage ? "past" : ""}">${i + 1 < p.stage ? "✓ " : ""}${n}</span>`).join("")}</div>
        <div class="bar"><i style="width:${percent(p).toFixed(0)}%"></i></div>
        <div class="pinfo"><span>${detail}</span><span><b class="tick" data-base="${p.elapsed}" data-at="${Date.now()}">${mmss(p.elapsed)}</b> 경과 · 보통 1분</span></div>
      </div>`;
    }
    setInterval(() => document.querySelectorAll(".tick").forEach((el) => {
      el.textContent = mmss(+el.dataset.base + Math.floor((Date.now() - +el.dataset.at) / 1000));
    }), 1000);

    const won = (n) => `₩${Math.round(n).toLocaleString("ko-KR")}`;
    // AI cost estimate (tokens x price table); "+" when a model's price is unknown.
    function usageText(u) {
      if (!u) return "";
      return u.krw ? `AI 약 ${won(u.krw)}${u.partial ? "+" : ""}` : `AI 토큰 ${Math.round(u.tokens / 1000)}천`;
    }

    async function loadUsage(token) {
      try {
        const res = await fetch(`${Pick3Account.API}/api/usage`, { headers: { "X-Pick3-Token": token } });
        if (!res.ok) return;
        const u = await res.json();
        if (!u.calls) return;
        $("usage").textContent = `이번 달 AI 사용 ${u.calls}회 · 약 ${won(u.krw)}${u.unpriced_models.length ? "+ (일부 모델 단가 미확인)" : ""} · 추정치, 정확한 금액은 Google 결제 화면`;
      } catch {}
    }

    function card(r) {
      const running = r.status === "running";
      const needPw = r.encrypted && !r.has_extract;
      const title = r.customer_name ? `${r.customer_name} 님` : (r.filename || "보장분석 보고서");
      const meta = [`${day(r.created_at)} 저장`, r.size_bytes ? `${(r.size_bytes / 1048576).toFixed(1)}MB` : "",
                    r.encrypted ? "🔒 암호 PDF" : "", r.records_count != null ? `병의원 기록 ${r.records_count}건` : "",
                    r.analyzed_at ? `작성 ${day(r.analyzed_at)}` : "", usageText(r.usage)].filter(Boolean).join(" · ");
      // HTML opens for reading on the phone; the PDFs of the same run (birth-date password) are for sending.
      const kind = (f) => (f.name.includes("맞춤") ? "제안서" : "분석서");
      const btn = (f, label) =>
        `<button class="file" type="button" data-id="${r.id}" data-i="${f.index}" data-name="${esc(f.name)}">${label}</button>`;
      const all = r.files || [];
      const htmls = all.filter((f) => !f.name.endsWith(".pdf")), pdfs = all.filter((f) => f.name.endsWith(".pdf"));
      const files = htmls.map((f) => btn(f, `📄 ${kind(f)}`)).join("");
      const pdfRow = pdfs.length ? `<div class="row pdfrow"><span class="pdflabel">PDF 보내기 (카톡 등 · 암호 생년월일)</span>` +
        pdfs.map((f) => btn(f, `${kind(f)} PDF`)).join("") + `</div>` : "";
      return `<article class="card ${running ? "running" : ""}" data-id="${r.id}">
        <div class="name">${esc(title)}</div>
        <div class="meta">${esc(meta)}</div>
        ${running ? progressHtml(r) : r.message ? `<div class="msg">${esc(r.message)}</div>` : ""}
        ${running ? "" : `<form class="row run" data-id="${r.id}">
          ${needPw ? `<input type="password" inputmode="numeric" autocomplete="off" placeholder="PDF 암호(보통 생년월일 8자리)" required />` : ""}
          <button class="btn" type="submit">${(r.files || []).length ? "다시 작성" : "제안서 작성"}</button>
          ${r.has_extract ? `<button class="btn ghost stbtn" type="button" data-id="${r.id}">📝 계약 상태</button>` : ""}
        </form><div class="err" data-err="${r.id}"></div>`}
        <div class="row">${files}${running ? "" : `<button class="del" type="button" data-id="${r.id}">삭제</button>`}</div>
        ${!running && r.has_extract ? `<div class="stpanel" id="st-${r.id}" hidden></div>` : ""}
        ${pdfRow}
      </article>`;
    }

    async function load() {
      clearTimeout(timer);
      await Pick3Account.ready;
      const token = Pick3Account.getToken();
      if (!token) { $("state").innerHTML = '계정이 없습니다. <a href="./">홈</a>에서 들어가 주세요.'; return; }
      // Don't redraw while a password is being typed.
      if (document.activeElement && ["INPUT", "SELECT"].includes(document.activeElement.tagName)) { timer = setTimeout(load, 3000); return; }
      let data;
      try {
        const res = await fetch(`${Pick3Account.API}/api/coverage`, { headers: { "X-Pick3-Token": token } });
        if (res.status === 401) { $("state").innerHTML = '로그인이 필요합니다. <a href="./">홈</a>에서 다시 들어가 주세요.'; return; }
        data = await res.json();
        if (!res.ok) throw new Error(data.detail || res.status);
      } catch (e) {
        $("state").textContent = "불러오지 못했습니다. 서버가 깨어나는 중이면 30초 뒤 새로고침해 주세요.";
        return;
      }
      const rows = data.reports || [];
      loadUsage(token);
      $("state").textContent = rows.length ? `보고서 ${rows.length}건` : "";
      $("list").innerHTML = rows.length ? rows.map(card).join("") :
        '<p class="empty">아직 저장된 보고서가 없습니다.<br>카톡 등에서 보장분석 PDF → 공유 → <b>Pick3</b> 를 고르세요.</p>';
      if (rows.some((r) => r.status === "running")) timer = setTimeout(load, 3000);
      prefetchPdfs();
    }

    $("list").addEventListener("submit", async (e) => {
      const form = e.target.closest(".run");
      if (!form) return;
      e.preventDefault();
      const id = form.dataset.id, input = form.querySelector("input"), btn = form.querySelector("button");
      const err = document.querySelector(`[data-err="${id}"]`);
      btn.disabled = true; err.textContent = "";
      try {
        const res = await fetch(`${Pick3Account.API}/api/coverage/${id}/run`, {
          method: "POST", headers: { "Content-Type": "application/json", "X-Pick3-Token": Pick3Account.getToken() },
          body: JSON.stringify({ password: input ? input.value : "" }),
        });
        const d = await res.json().catch(() => ({}));
        if (!d.ok) { err.textContent = d.message || d.detail || "시작하지 못했습니다."; btn.disabled = false; return; }
      } catch { err.textContent = "서버에 연결하지 못했습니다."; btn.disabled = false; return; }
      if (input) input.blur();
      load();
    });

    // PDFs are fetched ahead of time: iOS only opens the share sheet during the tap itself, so the file
    // must already be in memory. Sharing a File (not a link) keeps its name and sends no extra URL.
    const pdfCache = new Map();
    async function fetchFile(id, i, name) {
      const key = `${id}:${i}`;
      if (pdfCache.has(key)) return pdfCache.get(key);
      const res = await fetch(`${Pick3Account.API}/api/coverage/${id}/files/${i}`,
                              { headers: { "X-Pick3-Token": Pick3Account.getToken() } });
      if (!res.ok) throw new Error(res.status);
      const file = new File([await res.blob()], name, { type: "application/pdf" });
      pdfCache.set(key, file);
      return file;
    }
    function prefetchPdfs() {
      document.querySelectorAll('.file[data-name$=".pdf"]').forEach((b) =>
        fetchFile(b.dataset.id, b.dataset.i, b.dataset.name).catch(() => {}));
    }
    async function sharePdf(b) {
      const key = `${b.dataset.id}:${b.dataset.i}`;
      const ready = pdfCache.get(key);
      if (ready && navigator.canShare && navigator.canShare({ files: [ready] })) {
        try { await navigator.share({ files: [ready] }); } catch (err) { /* closed the sheet */ }
        return;
      }
      try {
        const file = ready || await fetchFile(b.dataset.id, b.dataset.i, b.dataset.name);
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          b.textContent = "📤 한 번 더 누르면 보내기";  // the tap that waited for the download no longer counts
          return;
        }
        const a = document.createElement("a");  // desktop: save with its name
        a.href = URL.createObjectURL(file); a.download = file.name; a.click();
      } catch {
        alert("파일을 받지 못했습니다. 잠시 후 다시 해 주세요.");
      }
    }

    // Planner-confirmed payment status per contract (e.g. a contract no longer paid), then re-run.
    async function toggleStatus(id) {
      const box = document.getElementById(`st-${id}`);
      if (!box.hidden) { box.hidden = true; return; }
      box.hidden = false; box.innerHTML = '<p class="hint">불러오는 중…</p>';
      const res = await fetch(`${Pick3Account.API}/api/coverage/${id}/contracts`, { headers: { "X-Pick3-Token": Pick3Account.getToken() } }).catch(() => null);
      const d = res && res.ok ? await res.json() : null;
      if (!d || !d.contracts || !d.contracts.length) { box.innerHTML = `<p class="hint">${esc((d && d.message) || "불러오지 못했습니다.")}</p>`; return; }
      const est = (c) => c.estimate === "paid_up" ? `납입 끝남 추정 (${c.estimate_basis || ""})` : "납입 중";
      box.innerHTML = '<p class="hint">설계사가 아는 실제 상태로 고르세요. "자동"은 Pick3 추정을 씁니다.</p>' + d.contracts.map((c) => `
        <div class="c"><div class="n">${c.no}. ${esc(c.insurer)} ${esc(c.product)}</div>
          <div class="k">${c.premium ? won(c.premium) + (c.pay_cycle === "월납" ? "/월" : " " + esc(c.pay_cycle)) : "-"} · 납입 ${c.paid_count ?? "-"}회 · ${esc(c.start || "")}~${esc(c.end || "종신")} · Pick3 추정: ${esc(est(c))}</div>
          <select data-no="${c.no}" class="${c.status !== "auto" ? "set" : ""}">
            <option value="auto">자동 (Pick3 추정)</option>
            ${Object.entries(d.statuses).map(([k, v]) => `<option value="${k}" ${c.status === k ? "selected" : ""}>${esc(v)}</option>`).join("")}
          </select></div>`).join("") +
        `<div class="row"><button class="btn stsave" type="button" data-id="${id}">저장하고 다시 작성</button></div>`;
    }

    async function saveStatus(id, btn) {
      const overrides = {};
      document.querySelectorAll(`#st-${id} select`).forEach((s) => { if (s.value !== "auto") overrides[s.dataset.no] = s.value; });
      btn.disabled = true;
      const h = { "Content-Type": "application/json", "X-Pick3-Token": Pick3Account.getToken() };
      const put = await fetch(`${Pick3Account.API}/api/coverage/${id}/overrides`, { method: "PUT", headers: h, body: JSON.stringify({ overrides }) }).catch(() => null);
      if (!put || !put.ok) { alert("저장하지 못했습니다. (DB에 계약 상태 칸이 없으면 migration 009 실행 필요)"); btn.disabled = false; return; }
      const run = await fetch(`${Pick3Account.API}/api/coverage/${id}/run`, { method: "POST", headers: h, body: "{}" }).catch(() => null);
      const d = run ? await run.json().catch(() => ({})) : {};
      if (!d.ok) alert(d.message || "다시 작성을 시작하지 못했습니다.");
      load();
    }

    $("list").addEventListener("click", async (e) => {
      const f = e.target.closest(".file");
      if (f && f.dataset.name.endsWith(".pdf")) {  // PDFs are for sending: share the named file itself
        await sharePdf(f);
        return;
      }
      if (f) {
        const win = window.open("", "_blank");  // open now: Safari blocks pop-ups opened after an await
        try {
          const res = await fetch(`${Pick3Account.API}/api/coverage/${f.dataset.id}/files/${f.dataset.i}`,
                                  { headers: { "X-Pick3-Token": Pick3Account.getToken() } });
          if (!res.ok) throw new Error(res.status);
          const type = f.dataset.name.endsWith(".html") ? "text/html" : "application/pdf";
          const url = URL.createObjectURL(new File([await res.blob()], f.dataset.name, { type }));
          if (win) win.location.href = url;
          else { const a = document.createElement("a"); a.href = url; a.download = f.dataset.name; a.click(); }
        } catch {
          if (win) win.close();
          alert("파일을 받지 못했습니다. 잠시 후 다시 해 주세요.");
        }
        return;
      }
      const sb = e.target.closest(".stbtn");
      if (sb) { await toggleStatus(sb.dataset.id); return; }
      const ss = e.target.closest(".stsave");
      if (ss) { await saveStatus(ss.dataset.id, ss); return; }
      const d = e.target.closest(".del");
      if (!d || !confirm("이 보고서와 만든 결과를 모두 지울까요?")) return;
      const res = await fetch(`${Pick3Account.API}/api/coverage/${d.dataset.id}`, {
        method: "DELETE", headers: { "X-Pick3-Token": Pick3Account.getToken() },
      }).catch(() => null);
      const body = res ? await res.json().catch(() => ({})) : {};
      if (!res || !res.ok || body.ok === false) { alert(body.message || "지우지 못했습니다."); return; }
      load();
    });

    document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
    load();
  </script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <meta name="referrer" content="no-referrer" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <title>저장한 맛집</title>
  <style>
    :root {
      --bg: #0f1115; --surface: #181c24; --surface-2: #222733; --border: #2c3342;
      --text: #f3f5f8; --muted: #9aa3b2; --accent: #ff6b35; --danger: #ff8a8a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg); color: var(--text); min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      padding: 20px 16px 48px; max-width: 560px; margin: 0 auto; line-height: 1.45;
    }
    a { color: inherit; }
    .top { display: flex; justify-content: space-between; align-items: center; }
    .home { color: var(--muted); text-decoration: none; font-size: 14px; }
    h1 { font-size: 22px; font-weight: 800; margin-top: 10px; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .tools { display: flex; gap: 8px; margin-top: 14px; }
    input[type=search], select {
      font: inherit; font-size: 16px; color: var(--text); background: var(--surface);
      border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
    }
    input[type=search] { flex: 1; min-width: 0; }
    .chips { display: flex; gap: 6px; overflow-x: auto; margin-top: 10px; padding-bottom: 4px; }
    .chip {
      flex: none; font: inherit; font-size: 13px; color: var(--muted); background: transparent;
      border: 1px solid var(--border); border-radius: 999px; padding: 6px 11px;
    }
    .chip.on { color: var(--text); border-color: var(--accent); }
    .list { margin-top: 12px; display: grid; gap: 10px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 13px 14px; }
    .card .name { font-size: 16px; font-weight: 700; }
    .card .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .card .menu { font-size: 13px; margin-top: 6px; }
    .card .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .card .row a, .card .row button {
      font: inherit; font-size: 13px; color: var(--text); background: var(--surface-2); text-decoration: none;
      border: 1px solid var(--border); border-radius: 999px; padding: 6px 11px;
    }
    .card .row .del { color: var(--danger); background: transparent; margin-left: auto; }
    .msg { color: var(--muted); font-size: 14px; margin-top: 18px; text-align: center; }
    .err { color: var(--danger); }
  </style>
</head>
<body>
  <div class="top">
    <a class="home" href="./">← 홈</a>
    <a class="home" href="pick3.html">지금 갈 곳 3곳 →</a>
  </div>
  <h1>📌 저장한 맛집</h1>
  <p class="sub" id="sub">불러오는 중…</p>

  <div class="tools">
    <input type="search" id="q" placeholder="이름·메뉴·동네 검색" autocomplete="off" />
    <select id="sort" aria-label="정렬">
      <option value="new">최근 저장순</option>
      <option value="name">이름순</option>
      <option value="area">동네순</option>
    </select>
  </div>
  <div class="chips" id="chips" aria-label="동네"></div>

  <div class="list" id="list"></div>
  <p class="msg" id="msg"></p>

  <script src="account.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const SORT_KEY = "pick3_saved_sort";
    let items = [];
    let area = "";

    const areaOf = (p) => (p.area || "").trim() || (p.address || "").split(" ").slice(1, 3).join(" ") || "기타";
    const day = (s) => (s || "").slice(0, 10);

    function mapUrl(p) {
      if (p.kakao_url) return p.kakao_url;
      if (p.naver_url) return p.naver_url;
      return "https://map.kakao.com/?q=" + encodeURIComponent(`${p.name} ${p.area || ""}`.trim());
    }

    function render() {
      const q = $("q").value.trim().toLowerCase();
      const sort = $("sort").value;
      let rows = items.filter((p) => !area || areaOf(p) === area);
      if (q) rows = rows.filter((p) => [p.name, p.signature_menu, p.category, p.area, p.address, p.memo]
        .join(" ").toLowerCase().includes(q));
      const cmp = {
        new: (a, b) => (b.created_at || "").localeCompare(a.created_at || ""),
        name: (a, b) => a.name.localeCompare(b.name, "ko"),
        area: (a, b) => areaOf(a).localeCompare(areaOf(b), "ko") || a.name.localeCompare(b.name, "ko"),
      }[sort];
      rows.sort(cmp);
      $("list").innerHTML = rows.map((p) => `
        <article class="card">
          <div class="name">${esc(p.name)}</div>
          <div class="meta">${esc([p.category, areaOf(p)].filter(Boolean).join(" · "))} · ${esc(day(p.created_at))}</div>
          ${p.signature_menu ? `<div class="menu">🍴 ${esc(p.signature_menu)}</div>` : ""}
          ${p.memo ? `<div class="menu">📝 ${esc(p.memo)}</div>` : ""}
          <div class="row">
            <a href="${esc(mapUrl(p))}" target="_blank" rel="noopener">🗺️ 지도</a>
            ${p.phone ? `<a href="tel:${esc(p.phone)}">📞 전화</a>` : ""}
            <button type="button" class="del" data-id="${esc(p.id)}" data-name="${esc(p.name)}">삭제</button>
          </div>
        </article>`).join("");
      $("msg").textContent = rows.length ? "" : (items.length ? "조건에 맞는 곳이 없습니다." : "아직 저장한 맛집이 없습니다.");
      $("sub").textContent = `${items.length}곳 저장` + (rows.length !== items.length ? ` · ${rows.length}곳 표시` : "");
    }

    function renderChips() {
      const counts = {};
      for (const p of items) counts[areaOf(p)] = (counts[areaOf(p)] || 0) + 1;
      const areas = Object.entries(counts).sort((a, b) => b[1] - a[1]);
      $("chips").innerHTML = [`<button class="chip ${area ? "" : "on"}" data-area="">전체</button>`]
        .concat(areas.map(([a, n]) => `<button class="chip ${a === area ? "on" : ""}" data-area="${esc(a)}">${esc(a)} ${n}</button>`))
        .join("");
    }

    async function load() {
      await Pick3Account.ready;
      const token = Pick3Account.getToken();
      if (!token) {
        $("sub").innerHTML = '<span class="err">계정이 없습니다. <a href="./">홈</a>에서 들어가 주세요.</span>';
        return;
      }
      try {
        const res = await fetch(`${Pick3Account.API}/api/saved`, { headers: { "X-Pick3-Token": token } });
        if (res.status === 401) {
          $("sub").innerHTML = '<span class="err">로그인이 필요합니다. <a href="./">홈</a>에서 다시 들어가 주세요.</span>';
          return;
        }
        if (!res.ok) throw new Error(res.status);
        items = (await res.json()).items || [];
      } catch {
        $("sub").innerHTML = '<span class="err">불러오지 못했습니다. 서버가 깨어나는 중이면 30초 뒤 새로고침해 주세요.</span>';
        return;
      }
      renderChips();
      render();
    }

    $("q").addEventListener("input", render);
    $("sort").addEventListener("change", () => {
      try { localStorage.setItem(SORT_KEY, $("sort").value); } catch {}
      render();
    });
    $("chips").addEventListener("click", (e) => {
      const b = e.target.closest(".chip");
      if (!b) return;
      area = b.dataset.area;
      renderChips();
      render();
    });
    $("list").addEventListener("click", async (e) => {
      const b = e.target.closest(".del");
      if (!b || !confirm(`'${b.dataset.name}'을(를) 저장 목록에서 지울까요?`)) return;
      const res = await fetch(`${Pick3Account.API}/api/saved/${b.dataset.id}`, {
        method: "DELETE", headers: { "X-Pick3-Token": Pick3Account.getToken() },
      }).catch(() => null);
      if (!res || !res.ok) { alert("지우지 못했습니다. 잠시 후 다시 해 주세요."); return; }
      items = items.filter((p) => String(p.id) !== b.dataset.id);
      renderChips();
      render();
    });

    try { const s = localStorage.getItem(SORT_KEY); if (s) $("sort").value = s; } catch {}
    load();
  </script>
</body>
</html>
